name: DIAG MRL-0102 Closeout Ledger

on:
  push:
    branches:
      - diag/mrl-0102-closeout-0e8ecc7

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Apply exact MRL-0102 closeout block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("specs/mesc-research-loop-v1/tasks.md")
          text = path.read_text(encoding="utf-8")
          old = '''- [ ] **MRL-0102 — Implement `ResearchHypothesis`**
            - Depends on: MRL-0101.
            - Test: mechanism, predicted effects, falsification criteria, evidence refs, and parent
              relationships are required and content-addressed.
          '''
          new = '''- [x] **MRL-0102 — Implement `ResearchHypothesis`**
            - Depends on: MRL-0101.
            - Test: mechanism, predicted effects, falsification criteria, evidence refs, and parent
              relationships are required and content-addressed.
            - Closeout rule: this checkbox is a branch closeout candidate only. `MRL-0102` becomes
              `CLOSED_CANONICAL` only if the exact final head containing it passes fresh repository
              checks and independent review, remains the exact PR head through expected-head merge,
              and is then present on canonical `main`.
            - Eligibility effect: MRL-0103 remains ineligible until MRL-0109 is also
              `CLOSED_CANONICAL` on canonical `main`.
          '''
          # Dedent the embedded Markdown block back to repository indentation.
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one MRL-0102 block, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Verify bounded ledger diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "specs/mesc-research-loop-v1/tasks.md"
          git diff -- specs/mesc-research-loop-v1/tasks.md
      - name: Commit qualified ledger blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/mesc-research-loop-v1/tasks.md
          git commit -m 'docs(mrl): mark MRL-0102 closeout candidate'
          git push origin HEAD:diag/mrl-0102-closeout-0e8ecc7
