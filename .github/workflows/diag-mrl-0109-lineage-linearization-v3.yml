name: diag-mrl-0109-lineage-linearization-v3

on:
  push:
    branches:
      - diag/mrl-0109-lineage-linearization-v3

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply diagnostic patch
        run: python .github/diagnostics/mrl_0109_lineage_linearization.py
      - name: Capture applied product diff
        shell: bash
        run: |
          git config user.name "MESC Diagnostic Inspection"
          git config user.email "actions@users.noreply.github.com"
          git add src/medscale/mesc/_mrl_research_input_admission_v1.py tests/test_mesc_mrl_research_input_admission_v1.py
          git commit -m "diag(mrl): capture applied lineage repair for inspection [skip ci]"
          git push
