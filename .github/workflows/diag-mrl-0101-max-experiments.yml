name: DIAG MRL-0101 Maximum Experiments

on:
  push:
    branches:
      - diag/mrl-0101-max-experiments-2f16

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Apply bounded max-experiments fix
        run: uv run python scripts/diag_fix_mrl_0101_max_experiments.py

      - name: Canonical formatting
        run: |
          uv run ruff format \
            src/medscale/mesc/_mrl_research_objective_v1.py \
            tests/test_mesc_mrl_research_objective_v1.py

      - name: Ruff lint and format check
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Strict mypy
        run: uv run mypy

      - name: Focused MRL tests
        run: |
          uv run pytest -q \
            tests/test_mesc_mrl_content_identity_v1.py \
            tests/test_mesc_mrl_research_objective_v1.py

      - name: Full test suite
        run: uv run pytest -q

      - name: Integrity gate
        run: uv run medscale check

      - name: Commit qualified target files
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/medscale/mesc/_mrl_research_objective_v1.py \
            tests/test_mesc_mrl_research_objective_v1.py
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --quiet && { echo "No target delta"; exit 1; }
          git commit -m "fix(diag): freeze maximum experiment count"
          git push origin "HEAD:${GITHUB_REF_NAME}"
