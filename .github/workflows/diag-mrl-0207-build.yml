name: Diagnostic MRL-0207 Closeout

on:
  push:
    branches: [diag/mrl-0207-build-7d1c]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact qualified feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/mrl-0207-sealed-data-access
          fetch-depth: 0

      - name: Require exact qualified implementation head
        run: test "$(git rev-parse HEAD)" = "d7229ecbc2669f9a05e31cf740aba1e097305c0f"

      - name: Close only MRL-0207 in canonical task ledger candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("specs/mesc-research-loop-v1/tasks.md")
          text = path.read_text()
          old = "- [ ] **MRL-0207 — Add sealed-data access adversarial test**"
          new = "- [x] **MRL-0207 — Add sealed-data access adversarial test**"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one open MRL-0207 checkbox")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "specs/mesc-research-loop-v1/tasks.md"
          git diff --unified=0 -- specs/mesc-research-loop-v1/tasks.md

      - name: Commit and push ledger-only closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/mesc-research-loop-v1/tasks.md
          git commit -m "docs(mrl): close MRL-0207"
          git push origin HEAD:refs/heads/test/mrl-0207-sealed-data-access
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
