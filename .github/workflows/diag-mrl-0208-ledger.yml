name: Diagnostic MRL-0208 Ledger Closeout

on:
  push:
    branches: [diag/mrl-0208-ledger-f2fb]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact qualified feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/mrl-0208-budget-escape
          fetch-depth: 0

      - name: Require qualified starting head
        run: test "$(git rev-parse HEAD)" = "f2fbee4d81efc0b483100b0ccc2f99d5e1c22e8f"

      - name: Close only MRL-0208 ledger entry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("specs/mesc-research-loop-v1/tasks.md")
          text = path.read_text()
          old = "- [ ] **MRL-0208 — Add resource/adaptive-budget escape test**"
          new = "- [x] **MRL-0208 — Add resource/adaptive-budget escape test**"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one open MRL-0208 ledger entry, found {text.count(old)}")
          if new in text:
              raise SystemExit("MRL-0208 is already closed")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Prove ledger-only delta and push
        run: |
          git diff --check
          test "$(git diff --name-only)" = "specs/mesc-research-loop-v1/tasks.md"
          test "$(git diff --numstat | awk '{print $1":"$2":"$3}')" = "1:1:specs/mesc-research-loop-v1/tasks.md"
          git diff --unified=0 -- specs/mesc-research-loop-v1/tasks.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/mesc-research-loop-v1/tasks.md
          git commit -m "chore(mrl): close MRL-0208 ledger"
          git push origin HEAD:refs/heads/test/mrl-0208-budget-escape
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
