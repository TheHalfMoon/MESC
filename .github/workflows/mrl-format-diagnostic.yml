name: MRL format diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diff:
    name: ruff format diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Print Ruff format diff
        run: uv run ruff format --diff src/medscale/mesc/_mrl_sealed_evaluation_evidence_v1.py
