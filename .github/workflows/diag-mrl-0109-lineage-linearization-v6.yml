name: diag-mrl-0109-lineage-linearization-v6

on:
  push:
    branches:
      - diag/mrl-0109-lineage-linearization-v6

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Apply local-construction and bounded-graph repair
        run: |
          python .github/diagnostics/mrl_0109_lineage_linearization_v5.py
          python .github/diagnostics/mrl_0109_lineage_linearization_v6_postfix.py
      - name: Canonicalize product Python
        run: |
          uv run ruff check --fix src/medscale/mesc/_mrl_research_input_admission_v1.py tests/test_mesc_mrl_research_input_admission_v1.py
          uv run ruff format src/medscale/mesc/_mrl_research_input_admission_v1.py tests/test_mesc_mrl_research_input_admission_v1.py
      - name: Ruff lint product surfaces
        run: uv run ruff check src/medscale/mesc/_mrl_research_input_admission_v1.py tests/test_mesc_mrl_research_input_admission_v1.py
      - name: Ruff format check product surfaces
        run: uv run ruff format --check src/medscale/mesc/_mrl_research_input_admission_v1.py tests/test_mesc_mrl_research_input_admission_v1.py
      - name: Strict mypy
        run: uv run mypy src tests
      - name: Focused admission tests
        run: uv run pytest -q tests/test_mesc_mrl_research_input_admission_v1.py tests/test_mesc_mrl_research_input_permission_trust_v1.py
      - name: Full pytest
        run: uv run pytest -q
      - name: MedScale integrity
        run: uv run medscale check
      - name: Verify bounded product diff
        shell: bash
        run: |
          actual="$(git diff --name-only 73ac1ae7491a42c5f058d2013afdf6925153bbfc -- | grep -v '^.github/' | sort)"
          expected=$'specs/mesc-research-loop-v1/spec.md\nsrc/medscale/mesc/_mrl_research_input_admission_v1.py\ntests/test_mesc_mrl_research_input_admission_v1.py'
          test "$actual" = "$expected"
      - name: Commit qualified product repair
        shell: bash
        run: |
          git config user.name "MESC Diagnostic Qualification"
          git config user.email "actions@users.noreply.github.com"
          git add specs/mesc-research-loop-v1/spec.md src/medscale/mesc/_mrl_research_input_admission_v1.py tests/test_mesc_mrl_research_input_admission_v1.py
          git commit -m "diag(mrl): qualify linear lineage validation v6 [skip ci]"
          git push
