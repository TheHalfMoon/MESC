name: Auth fixture codemod diagnostic 7

on:
  push:
    branches:
      - diag/mesc-auth-format-218
    paths:
      - .github/workflows/diag-auth-fixture-codemod7-218.yml

permissions:
  contents: read

jobs:
  codemod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Generate fixture updates
        run: uv run python scripts/diag_auth_fixture_codemod_218.py
      - name: Format and lint fixture updates
        run: |
          uv run ruff check --fix tests/test_mesc_training_readiness_receipt_binding_v1.py tests/test_mesc_training_readiness_v1.py tests/test_mesc_training_launch_plan_v1.py tests/test_mesc_training_executor_v1.py tests/test_mesc_training_orchestrator_v1.py
          uv run ruff format tests/test_mesc_training_readiness_receipt_binding_v1.py tests/test_mesc_training_readiness_v1.py tests/test_mesc_training_launch_plan_v1.py tests/test_mesc_training_executor_v1.py tests/test_mesc_training_orchestrator_v1.py
          uv run ruff check tests/test_mesc_training_readiness_receipt_binding_v1.py tests/test_mesc_training_readiness_v1.py tests/test_mesc_training_launch_plan_v1.py tests/test_mesc_training_executor_v1.py tests/test_mesc_training_orchestrator_v1.py
      - name: Run downstream tests
        run: uv run pytest -q tests/test_mesc_training_authorization_receipt_v1.py tests/test_mesc_training_readiness_receipt_binding_v1.py tests/test_mesc_training_readiness_v1.py tests/test_mesc_training_launch_plan_v1.py tests/test_mesc_training_executor_v1.py tests/test_mesc_training_orchestrator_v1.py
      - name: Upload validated fixture bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auth-fixture-validated-bytes
          path: |
            tests/test_mesc_training_readiness_receipt_binding_v1.py
            tests/test_mesc_training_readiness_v1.py
            tests/test_mesc_training_launch_plan_v1.py
            tests/test_mesc_training_executor_v1.py
            tests/test_mesc_training_orchestrator_v1.py
          retention-days: 1
          if-no-files-found: error
