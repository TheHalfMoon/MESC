name: P2 Ruff Repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hf-p2-ruff-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    name: repair exact P2 lint findings
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Bind repair to reviewed head
        run: test "$(git rev-parse HEAD)" = "ddd1a902c929f6ca996b63f9f32a27432b9e196f"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Apply exact Ruff repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/medscale/mesc/_hf_publication_v2.py")
          text = path.read_text()

          replacements = [
              (
                  "from contextlib import contextmanager\n"
                  "from dataclasses import dataclass\n"
                  "from pathlib import Path, PurePosixPath\n"
                  "from typing import Any, Iterator, Literal, cast\n",
                  "from collections.abc import Iterator\n"
                  "from contextlib import contextmanager\n"
                  "from dataclasses import dataclass\n"
                  "from pathlib import Path, PurePosixPath\n"
                  "from typing import Any, Literal, cast\n",
              ),
              (
                  "            from huggingface_hub import (\n"
                  "                CommitOperationAdd,\n"
                  "                HfApi,\n"
                  "                __version__ as hub_version,\n"
                  "                get_token,\n"
                  "                hf_hub_download,\n"
                  "            )\n",
                  "            from huggingface_hub import (\n"
                  "                CommitOperationAdd,\n"
                  "                HfApi,\n"
                  "                get_token,\n"
                  "                hf_hub_download,\n"
                  "            )\n"
                  "            from huggingface_hub import __version__ as hub_version\n",
              ),
              (
                  '    "EXPECTED_WORKFLOW_REF",\n'
                  '    "HfPublicationTransportError",\n'
                  '    "PUBLICATION_MODE",\n'
                  '    "PublicationAuthority",\n'
                  '    "ReleaseAssetBinding",\n'
                  '    "SCHEMA_AUTHORITY",\n'
                  '    "SCHEMA_RECEIPT",\n'
                  '    "TRANSPORT_MANIFEST_PATHS",\n',
                  '    "EXPECTED_WORKFLOW_REF",\n'
                  '    "PUBLICATION_MODE",\n'
                  '    "SCHEMA_AUTHORITY",\n'
                  '    "SCHEMA_RECEIPT",\n'
                  '    "TRANSPORT_MANIFEST_PATHS",\n'
                  '    "HfPublicationTransportError",\n'
                  '    "PublicationAuthority",\n'
                  '    "ReleaseAssetBinding",\n',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit("expected Ruff repair target not found exactly once")
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Qualify repaired candidate
        shell: bash
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q tests/test_mesc_hf_publication_v2.py
          git diff --check
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_hf_publication_v2.py
          git rm .github/workflows/hf-p2-ruff-repair.yml
          git diff --cached --check
          git commit -m "fix: satisfy P2 lint contract"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
