name: diag MRL-0510 py3.11 shards

on:
  push:
    branches:
      - diag/mrl-0510-py311-shards-40593d

permissions:
  contents: read

jobs:
  pytest:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync (locked)
        run: uv sync --frozen
      - name: Pytest shard
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test*.py' | sort)
          selected=()
          for i in "${!files[@]}"; do
            if (( i % 4 == SHARD )); then
              selected+=("${files[$i]}")
            fi
          done
          printf 'Shard %s files:\n' "$SHARD"
          printf '%s\n' "${selected[@]}"
          uv run pytest --cov --cov-report=term-missing -q "${selected[@]}"
