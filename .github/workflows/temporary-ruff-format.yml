name: Temporary Ruff Format

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Apply canonical Ruff formatting
        run: uv run ruff format .
      - name: Remove temporary workflow and commit formatting
        shell: bash
        run: |
          rm .github/workflows/temporary-ruff-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply canonical Ruff formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
