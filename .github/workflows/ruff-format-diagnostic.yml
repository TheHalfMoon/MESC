name: Ruff Format Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --frozen
      - name: Format diagnostic files
        run: >-
          uv run ruff format
          src/medscale/mesc/_bt_report_schema_fixture_v1.py
          tests/test_mesc_bt_report_conformance_fixture_v1.py
      - name: Emit formatted schema bytes
        run: |
          echo 'SCHEMA_BASE64_BEGIN'
          base64 -w0 src/medscale/mesc/_bt_report_schema_fixture_v1.py
          echo
          echo 'SCHEMA_BASE64_END'
      - name: Emit formatted test bytes
        run: |
          echo 'TEST_BASE64_BEGIN'
          base64 -w0 tests/test_mesc_bt_report_conformance_fixture_v1.py
          echo
          echo 'TEST_BASE64_END'
