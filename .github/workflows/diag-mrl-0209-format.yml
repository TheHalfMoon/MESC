name: Diagnostic MRL-0209 Format

on:
  push:
    branches:
      - diag/mrl-0209-format-86028

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/mrl-0209-raw-log-prompt-injection
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Verify and repair exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='86028a10a67f386de0983c864e414e472e38cf26'
          test "$(git rev-parse HEAD)" = "$expected"
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_mesc_mrl_raw_log_prompt_injection_v1.py')
          text = path.read_text()
          old = '    assert injected.receipt.raw_output_artifact_sha256s == baseline.receipt.raw_output_artifact_sha256s\n'
          new = '''    assert (
              injected.receipt.raw_output_artifact_sha256s
              == baseline.receipt.raw_output_artifact_sha256s
          )
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one formatting target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          uv sync --frozen
          uv run ruff check tests/test_mesc_mrl_raw_log_prompt_injection_v1.py
          uv run ruff format --check tests/test_mesc_mrl_raw_log_prompt_injection_v1.py
          uv run pytest -q tests/test_mesc_mrl_raw_log_prompt_injection_v1.py
          git diff --check
          git diff -- tests/test_mesc_mrl_raw_log_prompt_injection_v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_mesc_mrl_raw_log_prompt_injection_v1.py
          git commit -m 'style(mrl): format prompt-injection assertion'
          git push origin HEAD:test/mrl-0209-raw-log-prompt-injection
