name: Diagnostic MRL-0206 Build

on:
  push:
    branches: [diag/mrl-0206-build-3c6e]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/mrl-0206-metric-tampering
          fetch-depth: 0

      - name: Require canonical starting head
        run: test "$(git rev-parse HEAD)" = "3c6e2d15b875e264103a0d7ee0cb0c8976db5e9a"

      - name: Append MRL-0206 adversarial tests
        run: |
          cat >> tests/test_mesc_mrl_fixture_loop_v1.py <<'PY'


          def test_mrl_0206_metric_fabrication_cannot_reuse_canonical_receipt() -> None:
              result = _complete()
              evaluation = result.observation.evaluation
              assert evaluation is not None
              object.__setattr__(evaluation, "score", 0)

              with pytest.raises(FixtureLoopError, match="metric artifact"):
                  decide_fixture_experiment(
                      result.proposal,
                      result.observation,
                      result.receipt,
                  )


          def test_mrl_0206_modified_evaluator_cannot_build_valid_receipt() -> None:
              result = _complete()
              trusted = _evaluator()
              modified = FixtureEvaluator(
                  evaluator_id=trusted.evaluator_id,
                  metric_id=trusted.metric_id,
                  target_values=(
                      FixtureParameterValue(parameter_id="alpha", value=0),
                      FixtureParameterValue(parameter_id="beta", value=0),
                  ),
              )

              with pytest.raises(FixtureLoopError, match="evaluator artifact"):
                  build_fixture_experiment_receipt(
                      _plan(),
                      modified,
                      result.observation,
                      _manifest(),
                      _code_identity(),
                  )


          def test_mrl_0206_fixture_metrics_never_claim_sealed_or_promotion_authority() -> None:
              result = _complete()
              payload = result.to_dict()

              assert result.receipt.metric_artifacts[0].tier is EvaluationTier.DEVELOPMENT
              assert result.decision.can_authorize_promotion is False
              assert payload["non_evidence"] is True
              assert payload["can_update_campaign"] is False
              assert payload["can_authorize_real_execution"] is False
              assert payload["can_authorize_training"] is False
              assert payload["can_authorize_model_promotion"] is False
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Focused lint and format
        run: |
          uv run ruff check tests/test_mesc_mrl_fixture_loop_v1.py
          uv run ruff format --check tests/test_mesc_mrl_fixture_loop_v1.py

      - name: Focused MRL-0206 tests
        run: uv run pytest -q tests/test_mesc_mrl_fixture_loop_v1.py -k 'mrl_0206'

      - name: Prove test-only delta and push
        run: |
          git diff --check
          test "$(git diff --name-only)" = "tests/test_mesc_mrl_fixture_loop_v1.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_mesc_mrl_fixture_loop_v1.py
          git commit -m "test(mrl): add metric tampering adversarial coverage"
          git push origin HEAD:refs/heads/test/mrl-0206-metric-tampering
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
