name: Diagnostic MRL-0206 Build

on:
  push:
    branches: [diag/mrl-0206-build-3c6e]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/mrl-0206-metric-tampering
          fetch-depth: 0

      - name: Require exact reviewed head
        run: test "$(git rev-parse HEAD)" = "2ec624d4bee93cb5a32cb58490c6e663da95ef32"

      - name: Add missing MRL-0206 adversarial cases
        run: |
          cat >> tests/test_mesc_mrl_fixture_loop_v1.py <<'PY'


          def test_mrl_0206_fabricated_favorable_metric_cannot_create_evidence_candidate() -> None:
              result = _complete(alpha=1, beta=0)
              assert result.decision.state is ResearchDecisionState.REJECT
              evaluation = result.observation.evaluation
              assert evaluation is not None
              assert evaluation.score < evaluation.max_score
              object.__setattr__(evaluation, "score", evaluation.max_score)

              with pytest.raises(FixtureLoopError, match="canonical revalidation"):
                  decide_fixture_experiment(
                      result.proposal,
                      result.observation,
                      result.receipt,
                  )


          def test_mrl_0206_forged_sealed_metric_tier_is_rejected() -> None:
              result = _complete()
              metric_artifact = result.receipt.metric_artifacts[0]
              object.__setattr__(metric_artifact, "tier", EvaluationTier.SEALED)

              with pytest.raises(FixtureLoopError, match="canonical revalidation"):
                  decide_fixture_experiment(
                      result.proposal,
                      result.observation,
                      result.receipt,
                  )
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Focused lint and format
        run: |
          uv run ruff check tests/test_mesc_mrl_fixture_loop_v1.py
          uv run ruff format --check tests/test_mesc_mrl_fixture_loop_v1.py

      - name: Focused MRL-0206 tests
        run: uv run pytest -q tests/test_mesc_mrl_fixture_loop_v1.py -k 'mrl_0206'

      - name: Prove test-only delta and push
        run: |
          git diff --check
          test "$(git diff --name-only)" = "tests/test_mesc_mrl_fixture_loop_v1.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_mesc_mrl_fixture_loop_v1.py
          git commit -m "test(mrl): complete metric tampering adversarial coverage"
          git push origin HEAD:refs/heads/test/mrl-0206-metric-tampering
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
