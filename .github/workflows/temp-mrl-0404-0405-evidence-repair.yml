name: Temporary MRL 0404 0405 Evidence Repair

on:
  push:
    branches:
      - feat/mrl-0404-0405-evidence-3c3127

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mrl-0404-0405-evidence-3c3127
          persist-credentials: true

      - name: Apply construction-bound evidence repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          transfer = Path("src/medscale/mesc/_mrl_procedure_transfer_test_v1.py")
          text = transfer.read_text()
          old = '''        snapshot = ProcedureTransferTestReport(
              procedure_sha256=self.procedure_sha256,
              cases=tuple(
                  ProcedureTransferCaseEvidence._validated_snapshot(case) for case in self.cases
              ),
          )
          current_content_sha256 = derive_content_sha256(snapshot._semantic_dict_validated())
          if current_content_sha256 != bound_content_sha256:
              raise ProcedureTransferTestError("transfer report identity changed after construction")
          return snapshot
          '''
          new = '''        if len(self.cases) < 2:
              raise ProcedureTransferTestError(
                  "representative transfer evidence requires at least two exact cases"
              )
          if any(type(case) is not ProcedureTransferCaseEvidence for case in self.cases):
              raise ProcedureTransferTestError("cases contains an invalid item type")
          _require_sha256(self.procedure_sha256, "procedure_sha256")
          current_content_sha256 = derive_content_sha256(self._semantic_dict_validated())
          if current_content_sha256 != bound_content_sha256:
              raise ProcedureTransferTestError("transfer report identity changed after construction")
          return ProcedureTransferTestReport(
              procedure_sha256=self.procedure_sha256,
              cases=tuple(
                  ProcedureTransferCaseEvidence._validated_snapshot(case) for case in self.cases
              ),
          )
          '''
          if text.count(old) != 1:
              raise SystemExit("expected transfer snapshot block exactly once")
          text = text.replace(old, new)
          old = "        validated_cases.append(case_snapshot)\n"
          new = "        validated_cases.append(case)\n"
          if text.count(old) != 1:
              raise SystemExit("expected transfer builder append exactly once")
          transfer.write_text(text.replace(old, new))

          negative = Path("src/medscale/mesc/_mrl_procedure_negative_control_v1.py")
          text = negative.read_text()
          old = '''    case_snapshots = tuple(ProcedureNegativeControlCase._validated_snapshot(case) for case in cases)
          return ProcedureNegativeControlReport(
              procedure_sha256=procedure_sha256,
              declared_failure_modes=declared_failure_modes,
              cases=case_snapshots,
          )
          '''
          new = '''    for case in cases:
              ProcedureNegativeControlCase._validated_snapshot(case)
          return ProcedureNegativeControlReport(
              procedure_sha256=procedure_sha256,
              declared_failure_modes=declared_failure_modes,
              cases=cases,
          )
          '''
          if text.count(old) != 1:
              raise SystemExit("expected negative-control builder block exactly once")
          negative.write_text(text.replace(old, new))
          PY

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-mrl-0404-0405-evidence-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_mrl_procedure_transfer_test_v1.py \
                  src/medscale/mesc/_mrl_procedure_negative_control_v1.py \
                  .github/workflows/temp-mrl-0404-0405-evidence-repair.yml
          git commit -m "fix(mrl): preserve construction-bound evidence references"
          git push origin HEAD:feat/mrl-0404-0405-evidence-3c3127
