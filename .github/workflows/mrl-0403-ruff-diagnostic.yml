name: MRL-0403 Ruff diagnostic

on:
  pull_request:
    paths:
      - 'src/medscale/mesc/_mrl_procedure_replay_v1.py'
      - '.github/workflows/mrl-0403-ruff-diagnostic.yml'

permissions:
  contents: read

jobs:
  ruff-format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: uv sync --frozen
      - name: Ruff format diff diagnostic
        run: uv run ruff format --diff src/medscale/mesc/_mrl_procedure_replay_v1.py || true
