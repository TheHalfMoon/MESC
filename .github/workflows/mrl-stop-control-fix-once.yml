name: MRL stop-control hardening once

on:
  push:
    branches:
      - tmp/mrl-0103-format-transport

permissions:
  contents: write

jobs:
  harden-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify PR head ancestry
        run: git merge-base --is-ancestor aa5092ada36c27aa413303e5b1eb9c9ec9d5c003 HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Apply hardening
        run: python .mrl-tmp/patch_mrl0103.py

      - name: Qualify candidate
        run: |
          uv sync --frozen
          uv run ruff format src/medscale/mesc/_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_plan_v1.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q tests/test_mesc_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_plan_v1_regressions.py
          uv run pytest -q --cov --cov-report=term-missing
          uv run medscale check

      - name: Commit qualified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_plan_v1.py
          git rm .github/workflows/mrl-stop-control-fix-once.yml .mrl-tmp/patch_mrl0103.py
          git commit -m "fix(mrl): bind plan controls to frozen objective"
          git push origin HEAD:tmp/mrl-0103-format-transport
