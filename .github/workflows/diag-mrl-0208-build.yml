name: Diagnostic MRL-0208 External Freeze Repair

on:
  push:
    branches: [diag/mrl-0208-build-f8ca]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact reviewed feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/mrl-0208-budget-escape
          fetch-depth: 0

      - name: Require reviewed starting head
        run: test "$(git rev-parse HEAD)" = "ef96ca02d50f187e3aa415733885821df5e07f1a"

      - name: Move original plan freeze binding outside the plan object
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/medscale/mesc/_mrl_research_experiment_plan_v1.py")
          text = path.read_text()

          text = text.replace("import re\n", "import re\nimport weakref\n", 1)
          text = text.replace(
              "from typing import Final, TypeVar\n",
              "from typing import Callable, Final, TypeVar\n",
              1,
          )

          decorator_anchor = '''@dataclass(frozen=True, slots=True)\nclass ResearchExperimentPlan:\n'''
          if text.count(decorator_anchor) != 1:
              raise SystemExit("ResearchExperimentPlan decorator anchor mismatch")
          text = text.replace(
              decorator_anchor,
              '''@dataclass(frozen=True, slots=True, weakref_slot=True)\nclass ResearchExperimentPlan:\n''',
              1,
          )

          old_fields = '''    failure_conditions: tuple[PlanFailureCondition, ...]\n    _bound_resource_ceiling: tuple[int | None, ...] = field(\n        init=False, repr=False, compare=False\n    )\n    _bound_tier_allowances: tuple[tuple[int, int, int, tuple[str, ...]], ...] = field(\n        init=False, repr=False, compare=False\n    )\n\n    def __post_init__(self) -> None:\n        _validate_plan(self)\n        object.__setattr__(\n            self,\n            "_bound_resource_ceiling",\n            _resource_ceiling_freeze_binding(self.resource_ceiling),\n        )\n        object.__setattr__(\n            self,\n            "_bound_tier_allowances",\n            _tier_allowance_freeze_binding(self.tier_allowances),\n        )\n'''
          new_fields = '''    failure_conditions: tuple[PlanFailureCondition, ...]\n\n    def __post_init__(self) -> None:\n        _validate_plan(self)\n        _register_original_plan_budget_bindings(self)\n'''
          if text.count(old_fields) != 1:
              raise SystemExit("object-bound freeze fields anchor mismatch")
          text = text.replace(old_fields, new_fields, 1)

          start = text.index("def _resource_ceiling_freeze_binding(")
          end = text.index("def _validate_plan(plan: ResearchExperimentPlan) -> None:")
          replacement = '''_ResourceFreezeBinding = tuple[int | None, ...]\n_TierFreezeBinding = tuple[tuple[int, int, int, tuple[str, ...]], ...]\n_PlanFreezeRecord = tuple[\n    weakref.ReferenceType[ResearchExperimentPlan],\n    _ResourceFreezeBinding,\n    _TierFreezeBinding,\n]\n\n\ndef _resource_ceiling_freeze_binding(value: ResourceBudget) -> _ResourceFreezeBinding:\n    _require_exact_instance(value, ResourceBudget, "resource_ceiling")\n    return (\n        value.wall_clock_seconds,\n        value.compute_seconds,\n        value.input_tokens,\n        value.generated_tokens,\n        value.storage_bytes,\n        value.monetary_cost_microunits,\n        value.max_experiments,\n        value.retries,\n        value.known_failure_retries,\n        value.evaluator_invocations,\n    )\n\n\ndef _tier_allowance_freeze_binding(\n    values: tuple[PlanTierAllowance, ...],\n) -> _TierFreezeBinding:\n    _require_exact_instances(values, PlanTierAllowance, "tier_allowances")\n    return tuple(\n        (\n            int(value.tier),\n            value.max_queries,\n            value.max_result_exposures,\n            value.allowed_result_fields,\n        )\n        for value in values\n    )\n\n\ndef _build_plan_freeze_registry() -> tuple[\n    Callable[[ResearchExperimentPlan], None],\n    Callable[[ResearchExperimentPlan], None],\n]:\n    records: dict[int, _PlanFreezeRecord] = {}\n\n    def register(plan: ResearchExperimentPlan) -> None:\n        key = id(plan)\n\n        def discard(reference: weakref.ReferenceType[ResearchExperimentPlan]) -> None:\n            current = records.get(key)\n            if current is not None and current[0] is reference:\n                records.pop(key, None)\n\n        reference = weakref.ref(plan, discard)\n        existing = records.get(key)\n        if existing is not None and existing[0]() is plan:\n            raise ResearchExperimentPlanError(\n                "research experiment plan original budget binding is already registered"\n            )\n        records[key] = (\n            reference,\n            _resource_ceiling_freeze_binding(plan.resource_ceiling),\n            _tier_allowance_freeze_binding(plan.tier_allowances),\n        )\n\n    def require(plan: ResearchExperimentPlan) -> None:\n        record = records.get(id(plan))\n        if record is None or record[0]() is not plan:\n            raise ResearchExperimentPlanError(\n                "research experiment plan is missing its original frozen budget binding"\n            )\n        _, bound_resource_ceiling, bound_tier_allowances = record\n        if bound_resource_ceiling != _resource_ceiling_freeze_binding(plan.resource_ceiling):\n            raise ResearchExperimentPlanError(\n                "resource_ceiling changed after the research experiment plan was frozen"\n            )\n        if bound_tier_allowances != _tier_allowance_freeze_binding(plan.tier_allowances):\n            raise ResearchExperimentPlanError(\n                "tier_allowances changed after the research experiment plan was frozen"\n            )\n\n    return register, require\n\n\n(\n    _register_original_plan_budget_bindings,\n    _require_original_plan_budget_bindings,\n) = _build_plan_freeze_registry()\n\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Add hostile binding-poisoning coverage
        run: |
          cat >> tests/test_mesc_mrl_research_experiment_plan_v1.py <<'PY'


          @pytest.mark.parametrize(
              "private_name",
              ("_bound_resource_ceiling", "_bound_tier_allowances"),
          )
          def test_mrl_0208_plan_cannot_poison_original_freeze_binding(private_name: str) -> None:
              plan = _plan()
              object.__setattr__(
                  plan,
                  "resource_ceiling",
                  replace(plan.resource_ceiling, compute_seconds=121),
              )

              with pytest.raises(AttributeError):
                  object.__setattr__(plan, private_name, ())
              with pytest.raises(ResearchExperimentPlanError, match=r"changed after.*frozen"):
                  _ = plan.content_sha256
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Qualify repaired scope
        run: |
          uv run ruff format src/medscale/mesc/_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_plan_v1.py
          uv run ruff check src/medscale/mesc/_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_plan_v1.py
          uv run ruff format --check src/medscale/mesc/_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_plan_v1.py
          uv run mypy --strict src/medscale/mesc/_mrl_research_experiment_plan_v1.py
          uv run pytest -q tests/test_mesc_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_receipt_v1.py -k 'mrl_0208'

      - name: Prove bounded repair and push
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/medscale/mesc/_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_plan_v1.py | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_plan_v1.py
          git commit -m "fix(mrl): anchor plan freeze outside mutable state"
          git push origin HEAD:refs/heads/test/mrl-0208-budget-escape
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
