name: Diagnostic MRL-0208 Repair

on:
  push:
    branches: [diag/mrl-0208-build-f8ca]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact reviewed feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/mrl-0208-budget-escape
          fetch-depth: 0

      - name: Require reviewed starting head
        run: test "$(git rev-parse HEAD)" = "731bfe5b759966dfde85610b8ca2efae634201da"

      - name: Bind exact plan-time resource and adaptive ceilings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/medscale/mesc/_mrl_research_experiment_plan_v1.py")
          text = path.read_text()

          old_fields = '''    tier_allowances: tuple[PlanTierAllowance, ...]\n    stop_conditions: tuple[PlanStopCondition, ...]\n    failure_conditions: tuple[PlanFailureCondition, ...]\n\n    def __post_init__(self) -> None:\n        _validate_plan(self)\n'''
          new_fields = '''    tier_allowances: tuple[PlanTierAllowance, ...]\n    stop_conditions: tuple[PlanStopCondition, ...]\n    failure_conditions: tuple[PlanFailureCondition, ...]\n    _bound_resource_ceiling: tuple[int | None, ...] = field(\n        init=False, repr=False, compare=False\n    )\n    _bound_tier_allowances: tuple[tuple[int, int, int, tuple[str, ...]], ...] = field(\n        init=False, repr=False, compare=False\n    )\n\n    def __post_init__(self) -> None:\n        _validate_plan(self)\n        object.__setattr__(\n            self,\n            "_bound_resource_ceiling",\n            _resource_ceiling_freeze_binding(self.resource_ceiling),\n        )\n        object.__setattr__(\n            self,\n            "_bound_tier_allowances",\n            _tier_allowance_freeze_binding(self.tier_allowances),\n        )\n'''
          if text.count(old_fields) != 1:
              raise SystemExit("ResearchExperimentPlan field/post-init anchor mismatch")
          text = text.replace(old_fields, new_fields, 1)

          old_snapshot = '''        _require_exact_instance(\n            self,\n            ResearchExperimentPlan,\n            "research_experiment_plan",\n        )\n        objective = _snapshot_objective(self.objective)\n'''
          new_snapshot = '''        _require_exact_instance(\n            self,\n            ResearchExperimentPlan,\n            "research_experiment_plan",\n        )\n        _require_original_plan_budget_bindings(self)\n        objective = _snapshot_objective(self.objective)\n'''
          if text.count(old_snapshot) != 1:
              raise SystemExit("validated snapshot anchor mismatch")
          text = text.replace(old_snapshot, new_snapshot, 1)

          anchor = '''\n\ndef _validate_plan(plan: ResearchExperimentPlan) -> None:\n'''
          helpers = '''\n\ndef _resource_ceiling_freeze_binding(value: ResourceBudget) -> tuple[int | None, ...]:\n    _require_exact_instance(value, ResourceBudget, "resource_ceiling")\n    return (\n        value.wall_clock_seconds,\n        value.compute_seconds,\n        value.input_tokens,\n        value.generated_tokens,\n        value.storage_bytes,\n        value.monetary_cost_microunits,\n        value.max_experiments,\n        value.retries,\n        value.known_failure_retries,\n        value.evaluator_invocations,\n    )\n\n\ndef _tier_allowance_freeze_binding(\n    values: tuple[PlanTierAllowance, ...],\n) -> tuple[tuple[int, int, int, tuple[str, ...]], ...]:\n    _require_exact_instances(values, PlanTierAllowance, "tier_allowances")\n    return tuple(\n        (\n            int(value.tier),\n            value.max_queries,\n            value.max_result_exposures,\n            value.allowed_result_fields,\n        )\n        for value in values\n    )\n\n\ndef _require_original_plan_budget_bindings(plan: ResearchExperimentPlan) -> None:\n    try:\n        bound_resource_ceiling = plan._bound_resource_ceiling\n        bound_tier_allowances = plan._bound_tier_allowances\n    except AttributeError as exc:\n        raise ResearchExperimentPlanError(\n            "research experiment plan is missing its original frozen budget bindings"\n        ) from exc\n\n    if bound_resource_ceiling != _resource_ceiling_freeze_binding(plan.resource_ceiling):\n        raise ResearchExperimentPlanError(\n            "resource_ceiling changed after the research experiment plan was frozen"\n        )\n    if bound_tier_allowances != _tier_allowance_freeze_binding(plan.tier_allowances):\n        raise ResearchExperimentPlanError(\n            "tier_allowances changed after the research experiment plan was frozen"\n        )\n\n\ndef _validate_plan(plan: ResearchExperimentPlan) -> None:\n'''
          if text.count(anchor) != 1:
              raise SystemExit("validate plan anchor mismatch")
          text = text.replace(anchor, helpers, 1)
          path.write_text(text)
          PY

      - name: Align original MRL-0208 tests with earlier freeze rejection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_mesc_mrl_research_experiment_plan_v1.py")
          text = path.read_text()
          replacements = (
              ('match="compute_seconds exceeds"', 'match="resource_ceiling changed after"'),
              ('match="query allowance exceeds"', 'match="tier_allowances changed after"'),
              ('match="result exposure exceeds"', 'match="tier_allowances changed after"'),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing expected MRL-0208 message anchor: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Add in-envelope hostile rebinding adversarial tests
        run: |
          cat >> tests/test_mesc_mrl_research_experiment_plan_v1.py <<'PY'


          def test_mrl_0208_in_envelope_compute_rebinding_fails_original_freeze() -> None:
              plan = _plan()
              original_sha256 = plan.content_sha256
              assert plan.resource_ceiling.compute_seconds == 120

              object.__setattr__(
                  plan,
                  "resource_ceiling",
                  replace(plan.resource_ceiling, compute_seconds=121),
              )

              with pytest.raises(ResearchExperimentPlanError, match=r"changed after.*frozen"):
                  _ = plan.content_sha256
              assert original_sha256


          def test_mrl_0208_in_envelope_query_rebinding_fails_original_freeze() -> None:
              plan = _plan()
              original_sha256 = plan.content_sha256
              assert plan.tier_allowances[0].max_queries == 3

              object.__setattr__(
                  plan,
                  "tier_allowances",
                  (
                      replace(plan.tier_allowances[0], max_queries=4),
                      plan.tier_allowances[1],
                  ),
              )

              with pytest.raises(ResearchExperimentPlanError, match=r"changed after.*frozen"):
                  _ = plan.content_sha256
              assert original_sha256


          def test_mrl_0208_in_envelope_exposure_rebinding_fails_original_freeze() -> None:
              plan = _plan()
              original_sha256 = plan.content_sha256
              assert plan.tier_allowances[0].max_result_exposures == 3

              object.__setattr__(
                  plan,
                  "tier_allowances",
                  (
                      replace(plan.tier_allowances[0], max_result_exposures=4),
                      plan.tier_allowances[1],
                  ),
              )

              with pytest.raises(ResearchExperimentPlanError, match=r"changed after.*frozen"):
                  _ = plan.content_sha256
              assert original_sha256
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Format and qualify repaired scope
        run: |
          uv run ruff format src/medscale/mesc/_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_receipt_v1.py
          uv run ruff check src/medscale/mesc/_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_receipt_v1.py
          uv run ruff format --check src/medscale/mesc/_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_receipt_v1.py
          uv run mypy --strict src/medscale/mesc/_mrl_research_experiment_plan_v1.py
          uv run pytest -q tests/test_mesc_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_receipt_v1.py -k 'mrl_0208'

      - name: Prove bounded repair and push
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/medscale/mesc/_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_plan_v1.py | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_mrl_research_experiment_plan_v1.py tests/test_mesc_mrl_research_experiment_plan_v1.py
          git commit -m "fix(mrl): preserve exact frozen plan budgets"
          git push origin HEAD:refs/heads/test/mrl-0208-budget-escape
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
