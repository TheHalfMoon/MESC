name: Diagnostic MRL-0206 Ledger Closeout

on:
  push:
    branches: [diag/mrl-0206-ledger-closeout-d038]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/mrl-0206-metric-tampering
          fetch-depth: 0

      - name: Require exact qualified head
        run: test "$(git rev-parse HEAD)" = "d03893a1ddc77fcdeb677f6a1bdaedf2f524ee82"

      - name: Flip only MRL-0206 ledger checkbox
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("specs/mesc-research-loop-v1/tasks.md")
          text = path.read_text(encoding="utf-8")
          old = "- [ ] **MRL-0206 — Add metric-tampering adversarial test**"
          new = "- [x] **MRL-0206 — Add metric-tampering adversarial test**"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one open MRL-0206 checkbox")
          if new in text:
              raise SystemExit("MRL-0206 is already checked")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Prove ledger-only delta
        run: |
          git diff --check
          test "$(git diff --name-only)" = "specs/mesc-research-loop-v1/tasks.md"
          test "$(git diff --numstat)" = $'1\t1\tspecs/mesc-research-loop-v1/tasks.md'
          git diff -- specs/mesc-research-loop-v1/tasks.md

      - name: Commit and fast-forward PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/mesc-research-loop-v1/tasks.md
          git commit -m "docs(mrl): close MRL-0206 ledger candidate"
          git push origin HEAD:refs/heads/test/mrl-0206-metric-tampering
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
