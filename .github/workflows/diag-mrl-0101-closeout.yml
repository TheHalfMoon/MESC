name: DIAG MRL-0101 Closeout Candidate

on:
  push:
    branches:
      - diag/mrl-0101-closeout-3179

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply exact closeout-candidate mutation
        run: |
          python3 -c 'from pathlib import Path; p=Path("specs/mesc-research-loop-v1/tasks.md"); t=p.read_text(encoding="utf-8"); old="- [ ] **MRL-0101 — Implement `ResearchObjectiveContract`**"; new="- [x] **MRL-0101 — Implement `ResearchObjectiveContract`**"; assert t.count(old)==1, t.count(old); assert t.count(new)==0, t.count(new); p.write_text(t.replace(old,new,1),encoding="utf-8")'
          git diff --check
          test "$(git diff --name-only)" = "specs/mesc-research-loop-v1/tasks.md"
          git diff -- specs/mesc-research-loop-v1/tasks.md

      - name: Commit closeout-candidate ledger only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/mesc-research-loop-v1/tasks.md
          git diff --cached --quiet && { echo "No closeout delta"; exit 1; }
          test "$(git diff --cached --name-only)" = "specs/mesc-research-loop-v1/tasks.md"
          git commit -m "docs(diag): mark MRL-0101 closeout candidate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
