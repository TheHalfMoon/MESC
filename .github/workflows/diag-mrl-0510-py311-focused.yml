name: diag MRL-0510 py3.11 focused

on:
  push:
    branches:
      - diag/mrl-0510-py311-focused-40593d

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync (locked)
        run: uv sync --frozen
      - name: Run focused MRL-0505..0510 tests
        run: >-
          uv run pytest -q
          tests/test_mesc_mrl_researcher_benchmark_v1.py
          tests/test_mesc_mrl_researcher_arm_context_v1.py
          tests/test_mesc_mrl_researcher_comparison_report_v1.py
