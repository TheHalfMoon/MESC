name: Temporary Ruff Format 313

on:
  push:
    branches:
      - fix/mrl-0401-0402-revalidation-3de64a

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mrl-0401-0402-revalidation-3de64a
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Apply canonical Ruff formatting
        run: |
          uv run ruff format \
            src/medscale/mesc/_mrl_campaign_history_projection_v1.py \
            src/medscale/mesc/_mrl_procedure_candidate_extraction_v1.py \
            tests/test_mesc_mrl_campaign_history_projection_v1.py \
            tests/test_mesc_mrl_procedure_candidate_extraction_v1.py
      - name: Remove temporary workflow and commit formatting
        run: |
          rm .github/workflows/temp-ruff-format-313.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/medscale/mesc/_mrl_campaign_history_projection_v1.py \
            src/medscale/mesc/_mrl_procedure_candidate_extraction_v1.py \
            tests/test_mesc_mrl_campaign_history_projection_v1.py \
            tests/test_mesc_mrl_procedure_candidate_extraction_v1.py \
            .github/workflows/temp-ruff-format-313.yml
          git commit -m "style(mrl): apply canonical Ruff formatting"
          git push origin HEAD:fix/mrl-0401-0402-revalidation-3de64a
