name: Temporary MRL 0409 Preflight

on:
  push:
    branches:
      - feat/mrl-0409-memory-cost-comparison-8888c5

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mrl-0409-memory-cost-comparison-8888c5
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Apply deterministic typing repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/medscale/mesc/_mrl_procedure_memory_cost_comparison_v1.py")
          text = path.read_text()
          old = '''    for label, value in (\n        ("experiment_count", cost.experiment_count),\n        ("operation_count", cost.operation_count),\n        ("evaluator_invocations", cost.evaluator_invocations),\n        ("storage_bytes", cost.storage_bytes),\n        ("invalid_experiment_count", cost.invalid_experiment_count),\n        ("evidence_candidate_count", cost.evidence_candidate_count),\n        ("false_evidence_candidate_count", cost.false_evidence_candidate_count),\n    ):\n        if type(value) is not int or value < 0:\n            raise ProcedureMemoryCostComparisonError(\n                f"{label} must be an exact nonnegative integer"\n            )\n'''
          new = '''    for label, counter_value in (\n        ("experiment_count", cost.experiment_count),\n        ("operation_count", cost.operation_count),\n        ("evaluator_invocations", cost.evaluator_invocations),\n        ("storage_bytes", cost.storage_bytes),\n        ("invalid_experiment_count", cost.invalid_experiment_count),\n        ("evidence_candidate_count", cost.evidence_candidate_count),\n        ("false_evidence_candidate_count", cost.false_evidence_candidate_count),\n    ):\n        if type(counter_value) is not int or counter_value < 0:\n            raise ProcedureMemoryCostComparisonError(\n                f"{label} must be an exact nonnegative integer"\n            )\n'''
          if old not in text:
              raise SystemExit("expected typing-repair target not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format and safe lint fixes
        run: |
          uv run ruff format \
            src/medscale/mesc/_mrl_procedure_memory_cost_comparison_v1.py \
            tests/test_mesc_mrl_procedure_memory_cost_comparison_v1.py
          uv run ruff check --fix \
            src/medscale/mesc/_mrl_procedure_memory_cost_comparison_v1.py \
            tests/test_mesc_mrl_procedure_memory_cost_comparison_v1.py
          uv run ruff format \
            src/medscale/mesc/_mrl_procedure_memory_cost_comparison_v1.py \
            tests/test_mesc_mrl_procedure_memory_cost_comparison_v1.py
          uv run ruff check \
            src/medscale/mesc/_mrl_procedure_memory_cost_comparison_v1.py \
            tests/test_mesc_mrl_procedure_memory_cost_comparison_v1.py

      - name: Strict mypy
        run: uv run mypy

      - name: Focused pytest
        run: |
          uv run pytest -q \
            tests/test_mesc_mrl_procedure_memory_cost_comparison_v1.py \
            tests/test_mesc_mrl_procedure_search_index_v1.py \
            tests/test_mesc_mrl_fixture_loop_v1.py

      - name: Commit qualified files and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-mrl-0409-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_mrl_procedure_memory_cost_comparison_v1.py \
                  tests/test_mesc_mrl_procedure_memory_cost_comparison_v1.py \
                  .github/workflows/temp-mrl-0409-preflight.yml
          git commit -m "style(mrl): qualify MRL-0409 memory comparison"
          git push origin HEAD:feat/mrl-0409-memory-cost-comparison-8888c5
