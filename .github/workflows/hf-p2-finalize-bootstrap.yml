name: P2 Final Candidate Bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hf-p2-finalize-bootstrap.yml"

permissions:
  contents: write

jobs:
  finalize:
    name: persist final P2 candidate files
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Reconstruct exact P2 module and tests
        shell: bash
        run: |
          mkdir -p src/medscale/mesc tests
          cat             .tmp/p2/m01.b64 .tmp/p2/m02.b64 .tmp/p2/m03.b64 .tmp/p2/m04.b64             .tmp/p2/m05.b64 .tmp/p2/m06.b64 .tmp/p2/m07.b64 .tmp/p2/m08.b64             .tmp/p2/m09.b64 .tmp/p2/m10.b64 .tmp/p2/m11.b64 .tmp/p2/m12.b64             .tmp/p2/m13.b64 .tmp/p2/m14.b64             | tr -d '\n\r' | base64 -d > src/medscale/mesc/_hf_publication_v2.py
          cat             .tmp/p2/t01.b64 .tmp/p2/t02.b64 .tmp/p2/t03.b64             .tmp/p2/t04.b64 .tmp/p2/t05.b64 .tmp/p2/t06.b64             | tr -d '\n\r' | base64 -d > tests/test_mesc_hf_publication_v2.py
      - name: Verify exact file identities
        shell: bash
        run: |
          test "$(sha256sum src/medscale/mesc/_hf_publication_v2.py | cut -d' ' -f1)" =             "2e254a6dcfc11cffe3c6eae4ae9a8673b60e377f34d7a88c452e43dd6111f8fb"
          test "$(sha256sum tests/test_mesc_hf_publication_v2.py | cut -d' ' -f1)" =             "dcc514905661a9c7af45a883561d582771b18472fa4639f88b43d617f469d218"
          git diff --check
      - name: Commit exact final candidate and remove bootstrap state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/medscale/mesc/_hf_publication_v2.py             tests/test_mesc_hf_publication_v2.py
          git rm -r .tmp/p2
          git rm .github/workflows/hf-p2-finalize-bootstrap.yml
          git diff --cached --check
          git commit -m "feat: add governed Hugging Face publication v2"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
