name: P2 Final Candidate Bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hf-p2-finalize-bootstrap.yml"

permissions:
  contents: write

jobs:
  finalize:
    name: persist final P2 candidate files
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Decode exact final-candidate bundle
        shell: bash
        env:
          P2_BUNDLE_B64: 
        run: |
          printf '%s' "$P2_BUNDLE_B64" | base64 -d > /tmp/mesc-p2-final-files.tar.gz
          tar -xzf /tmp/mesc-p2-final-files.tar.gz -C .
          printf '%s  %s\n' \
            "a34c635d21b9de5c44c36760bb956c777284932d25a2ae8914d7e8d0dabd2fd0" \
            "scripts/mesc_hf_publish.py" \
            "81c0bf25d0a4a89b05d2dd3b87d66bc7e2a2629b9a5ce11f50425ff0febef816" \
            "specs/mesc-hf-publication-v2/README.md" \
            "7660f851626816d3351477d296aa37d973c8fa4f7aae4ebef78c5c56b7e00d80" \
            "specs/mesc-hf-publication-v2/authority.json" \
            "2e254a6dcfc11cffe3c6eae4ae9a8673b60e377f34d7a88c452e43dd6111f8fb" \
            "src/medscale/mesc/_hf_publication_v2.py" \
            "dcc514905661a9c7af45a883561d582771b18472fa4639f88b43d617f469d218" \
            "tests/test_mesc_hf_publication_v2.py" \
            > /tmp/expected-sha256.txt
          sha256sum -c /tmp/expected-sha256.txt
      - name: Verify exact candidate scope
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            "scripts/mesc_hf_publish.py"
            "specs/mesc-hf-publication-v2/README.md"
            "specs/mesc-hf-publication-v2/authority.json"
            "src/medscale/mesc/_hf_publication_v2.py"
            "tests/test_mesc_hf_publication_v2.py"
          )
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Commit exact final-candidate files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/mesc_hf_publish.py \
            specs/mesc-hf-publication-v2/README.md \
            specs/mesc-hf-publication-v2/authority.json \
            src/medscale/mesc/_hf_publication_v2.py \
            tests/test_mesc_hf_publication_v2.py
          git diff --cached --check
          git commit -m "feat: add governed Hugging Face publication v2"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
