name: MRL fail-closed review repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-review-repair:
    if: github.repository == 'TheHalfMoon/MESC' && github.event.pull_request.head.repo.full_name == 'TheHalfMoon/MESC' && github.head_ref == 'fix/mrl-7-project-state-contract-d36694'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Apply deterministic fail-closed repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count == expected:
                  file.write_text(text.replace(old, new), encoding="utf-8")
                  return
              if count == 0 and new in text:
                  return
              raise SystemExit(f"unexpected replacement count for {path}: {count}: {old!r}")

          legacy_path = "src/medscale/mesc/_mrl_machine_state_generation_legacy_v1.py"
          legacy = Path(legacy_path)
          text = legacy.read_text(encoding="utf-8")

          old_constant = '_REAL_EVIDENCE: Final = frozenset(f"MRL-08{n:02d}" for n in range(1, 9))\n'
          new_constant = old_constant + '_EXTERNAL_DEPENDENCY_TASKS: Final = frozenset({"MRL-0800"}) | _REAL_EVIDENCE\n'
          if new_constant not in text:
              if text.count(old_constant) != 1:
                  raise SystemExit("unexpected _REAL_EVIDENCE constant shape")
              text = text.replace(old_constant, new_constant)

          old_close = '''        if proof is not None and not _stale(\n            snapshot.repository_root,\n            snapshot.commit_sha,\n            task_id,\n            proof[0],\n        ):\n'''
          new_close = '''        if (\n            proof is not None\n            and _repository_closure_permitted(task_id)\n            and not _stale(\n                snapshot.repository_root,\n                snapshot.commit_sha,\n                task_id,\n                proof[0],\n            )\n        ):\n'''
          if new_close not in text:
              if text.count(old_close) != 1:
                  raise SystemExit("unexpected closure admission shape")
              text = text.replace(old_close, new_close)

          old_task_skip = '''        match = _TASK_RE.match(line)\n        if match is None:\n            continue\n'''
          new_task_skip = '''        match = _TASK_RE.match(line)\n        if match is None:\n            if line.startswith("- [") and "MRL-" in line:\n                raise MachineStateGenerationError("MRL task ledger contains malformed task record")\n            continue\n'''
          if new_task_skip not in text:
              if text.count(old_task_skip) != 1:
                  raise SystemExit("unexpected task parser shape")
              text = text.replace(old_task_skip, new_task_skip)

          start = text.index("\ndef _dependencies(lines: list[str], task_id: str) -> tuple[str, ...]:")
          end = text.index("\ndef _closure_proof(", start)
          new_dependencies = r'''

def _repository_closure_permitted(task_id: str) -> bool:
    """Repository-only closeout must not satisfy separately evidenced real-asset gates."""
    return task_id not in _REAL_EVIDENCE


def _dependency_clauses(lines: list[str]) -> tuple[str, ...]:
    clauses: list[str] = []
    prefixes = ("- Depends on:", "- Requires:")
    for index, line in enumerate(lines):
        stripped = line.strip()
        prefix = next((item for item in prefixes if stripped.startswith(item)), None)
        if prefix is None:
            continue
        parts = [stripped[len(prefix) :].strip()]
        cursor = index + 1
        while cursor < len(lines):
            continuation = lines[cursor].strip()
            if continuation.startswith("- "):
                break
            if continuation:
                parts.append(continuation)
            cursor += 1
        clause = " ".join(parts).strip()
        if not clause:
            raise MachineStateGenerationError("MRL dependency clause is empty")
        clauses.append(clause)
    return tuple(clauses)


def _dependencies(lines: list[str], task_id: str) -> tuple[str, ...]:
    clauses = _dependency_clauses(lines)
    text = "\n".join(clauses)
    matches = tuple(_DEP_RE.finditer(text))
    for match in matches:
        before = text[match.start() - 1] if match.start() else ""
        after = text[match.end()] if match.end() < len(text) else ""
        if (before and (before.isalnum() or before in "_-")) or (
            after and (after.isalnum() or after in "_-")
        ):
            raise MachineStateGenerationError(
                "MRL dependency reference or range is malformed or cross-prefix"
            )
    for occurrence in re.finditer(r"MRL-", text):
        if not any(match.start() <= occurrence.start() < match.end() for match in matches):
            raise MachineStateGenerationError(
                "MRL dependency reference or range is malformed or cross-prefix"
            )
    for dots in re.finditer(r"\.\.", text):
        if not any(
            match.start() <= dots.start() and dots.end() <= match.end() for match in matches
        ):
            raise MachineStateGenerationError(
                "MRL dependency reference or range is malformed or cross-prefix"
            )

    for clause in clauses:
        residual = _DEP_RE.sub("", clause)
        residual = re.sub(r"\b(?:and|plus)\b", "", residual, flags=re.IGNORECASE)
        residual = re.sub(r"[\s,.;:()]+", "", residual)
        if residual and task_id not in _EXTERNAL_DEPENDENCY_TASKS:
            raise MachineStateGenerationError(
                f"MRL task {task_id} has an unmodeled external dependency"
            )

    result: set[str] = set()
    for match in matches:
        start = int(match.group(1))
        end_text = match.group(2)
        if end_text is None:
            result.add(f"MRL-{start:04d}")
            continue
        end = int(end_text)
        if end < start:
            raise MachineStateGenerationError("MRL dependency range is descending")
        result.update(f"MRL-{value:04d}" for value in range(start, end + 1))
    if task_id in result:
        raise MachineStateGenerationError(f"MRL task {task_id} cannot depend on itself")
    return tuple(sorted(result))
'''
          existing = text[start:end]
          if "_dependency_clauses" not in existing:
              text = text[:start] + new_dependencies + text[end:]
          legacy.write_text(text, encoding="utf-8")

          ci_path = ".github/workflows/ci.yml"
          replace(
              ci_path,
              '''\n      - name: MRL machine-state drift/manual-edit gate\n        run: uv run pytest -q tests/test_mesc_mrl_machine_state_ci_gate_v1.py\n''',
              "",
          )

          test_path = "tests/test_mesc_mrl_machine_state_ci_gate_v1.py"
          test_file = Path(test_path)
          test_text = test_file.read_text(encoding="utf-8")
          marker = '''def test_dependency_parser_accepts_terminal_punctuation_and_valid_range() -> None:\n'''
          additions = '''def test_dependency_parser_rejects_unmodeled_external_dependency() -> None:\n    with pytest.raises(MachineStateGenerationError, match="unmodeled external dependency"):\n        legacy_machine_state._dependencies(\n            ["  - Depends on: external authority."],\n            "MRL-0999",\n        )\n\n\ndef test_dependency_parser_models_wrapped_external_gates_explicitly() -> None:\n    assert legacy_machine_state._dependencies(\n        [\n            "  - Depends on: MRL-0299, MRL-0399, and current",\n            "    training/runtime governance.",\n        ],\n        "MRL-0800",\n    ) == ("MRL-0299", "MRL-0399")\n    assert legacy_machine_state._dependencies(\n        ["  - Depends on: MRL-0800 and separate real-asset authorization/evidence."],\n        "MRL-0801",\n    ) == ("MRL-0800",)\n    assert legacy_machine_state._repository_closure_permitted("MRL-0800")\n    assert not legacy_machine_state._repository_closure_permitted("MRL-0801")\n\n\ndef test_task_parser_rejects_malformed_mrl_task_record() -> None:\n    with pytest.raises(MachineStateGenerationError, match="malformed task record"):\n        legacy_machine_state._task_records("- [x] **MRL-0001 - malformed delimiter**")\n\n\n'''
          if additions not in test_text:
              if marker not in test_text:
                  raise SystemExit("dependency test insertion marker missing")
              test_text = test_text.replace(marker, additions + marker, 1)
          test_file.write_text(test_text, encoding="utf-8")

          closeout_path = "tests/test_mesc_mrl_closeout_evidence_v1.py"
          closeout = Path(closeout_path)
          closeout_text = closeout.read_text(encoding="utf-8")
          function_start = closeout_text.index(
              "def test_manifest_is_bound_project_state_source_and_stale_gates_remain_open("
          )
          replacement = '''def test_manifest_is_bound_project_state_source(tmp_path: Path) -> None:\n    output_dir = tmp_path / "state"\n    generation.generate_machine_state(\n        Path(__file__).resolve().parents[1],\n        output_dir,\n    )\n    project = json.loads((output_dir / "PROJECT_STATE.json").read_bytes())\n    sources = project["sources"]\n    tasks = project["tasks"]\n    assert isinstance(sources, list)\n    assert isinstance(tasks, list)\n    bound = [\n        source\n        for source in sources\n        if isinstance(source, dict)\n        and source.get("path") == "specs/mesc-research-loop-v1/closeout-evidence-v1.json"\n    ]\n    assert len(bound) == 1\n    assert isinstance(bound[0].get("git_blob_sha"), str)\n    assert isinstance(bound[0].get("sha256"), str)\n    assert tasks\n    assert all(\n        isinstance(task, dict) and isinstance(task.get("task_id"), str) and "state" in task\n        for task in tasks\n    )\n'''
          closeout_text = closeout_text[:function_start] + replacement
          closeout.write_text(closeout_text, encoding="utf-8")
          PY

      - name: Format repaired Python files
        run: |
          uv run ruff format \
            src/medscale/mesc/_mrl_machine_state_generation_legacy_v1.py \
            tests/test_mesc_mrl_machine_state_ci_gate_v1.py \
            tests/test_mesc_mrl_closeout_evidence_v1.py

      - name: Verify lint and strict typing
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy

      - name: Verify focused fail-closed behavior
        run: >-
          uv run pytest -q
          tests/test_mesc_mrl_machine_state_ci_gate_v1.py
          tests/test_mesc_mrl_closeout_evidence_v1.py
          tests/test_mesc_mrl_machine_state_generation_v1.py
          tests/test_mesc_mrl_project_state_admission_v1.py
          tests/test_mesc_mrl_project_state_v1.py

      - name: Commit verified review repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            src/medscale/mesc/_mrl_machine_state_generation_legacy_v1.py \
            tests/test_mesc_mrl_machine_state_ci_gate_v1.py \
            tests/test_mesc_mrl_closeout_evidence_v1.py
          if git diff --cached --quiet; then
            echo "Review repairs already present."
            exit 0
          fi
          git commit -m "fix(mrl): fail closed on unmodeled task dependencies"
          git push origin HEAD:${{ github.head_ref }}
