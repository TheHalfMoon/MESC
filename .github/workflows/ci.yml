name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-pr190-finished-at-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync locked development environment
        run: uv sync --frozen

      - name: Apply exact PR 190 finished_at repair
        run: |
          set -euo pipefail
          python scripts/_diag_pr190_finished_at_fix.py
          uv run ruff format \
            src/medscale/mesc/_training_hf_local_sft_backend_v1.py \
            tests/test_mesc_training_hf_local_sft_backend_v1.py
          uv run ruff check \
            src/medscale/mesc/_training_hf_local_sft_backend_v1.py \
            tests/test_mesc_training_hf_local_sft_backend_v1.py
          uv run ruff format --check \
            src/medscale/mesc/_training_hf_local_sft_backend_v1.py \
            tests/test_mesc_training_hf_local_sft_backend_v1.py
          uv run mypy \
            src/medscale/mesc/_training_hf_local_sft_backend_v1.py \
            tests/test_mesc_training_hf_local_sft_backend_v1.py
          uv run pytest tests/test_mesc_training_hf_local_sft_backend_v1.py
          git diff --check

          git diff -- \
            src/medscale/mesc/_training_hf_local_sft_backend_v1.py \
            tests/test_mesc_training_hf_local_sft_backend_v1.py \
            specs/mesc-hf-local-sft-backend-v1/README.md \
            > /tmp/pr190-finished-at.patch
          test -s /tmp/pr190-finished-at.patch

          git fetch origin feat/mesc-hf-local-sft-backend-v1
          test "$(git rev-parse origin/feat/mesc-hf-local-sft-backend-v1)" = \
            "c1bd9415657dece4e5376db579a7d1693d6f3517"
          git reset --hard
          git switch --detach c1bd9415657dece4e5376db579a7d1693d6f3517
          git apply --check /tmp/pr190-finished-at.patch
          git apply /tmp/pr190-finished-at.patch
          git add \
            src/medscale/mesc/_training_hf_local_sft_backend_v1.py \
            tests/test_mesc_training_hf_local_sft_backend_v1.py \
            specs/mesc-hf-local-sft-backend-v1/README.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(mesc): record backend finish after publication"
          git push origin HEAD:refs/heads/feat/mesc-hf-local-sft-backend-v1
