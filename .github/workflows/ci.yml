name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  canonical-evidence-repair:
    if: github.repository == 'TheHalfMoon/MESC' && github.head_ref == 'fix/mrl-7-project-state-contract-d36694' && github.actor == 'TheHalfMoon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/mrl-7-project-state-contract-d36694
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Bind canonical-main evidence explicitly
        run: |
          python - <<'PY'
          from pathlib import Path

          generator = Path('src/medscale/mesc/_mrl_machine_state_generation_v1.py')
          text = generator.read_text(encoding='utf-8')
          old = '''            evidence[task_id] = (\n                f"canonical-merge:{proof[0]}",\n                f"qualified-head:{proof[1]}",\n            )\n'''
          new = '''            evidence[task_id] = (\n                f"canonical-main:{snapshot.canonical_main_sha}",\n                f"canonical-merge:{proof[0]}",\n                f"qualified-head:{proof[1]}",\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit('canonical evidence tuple target is not unique')
          generator.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_mesc_mrl_machine_state_ci_gate_v1.py')
          text = test_path.read_text(encoding='utf-8')
          marker = '''\ndef test_ci_gate_rejects_manually_edited_projection(tmp_path: Path) -> None:\n'''
          regression = '''\ndef test_canonical_main_anchor_is_explicit_and_stales_old_projection(tmp_path: Path) -> None:\n    repository = _clone_repository(tmp_path)\n    decision_base = _git_text(repository, "rev-parse", "HEAD")\n    first_dir = tmp_path / "first-anchor"\n    first = generate_machine_state(repository, first_dir)\n    first_payload = _load_project_state(first_dir / "PROJECT_STATE.json")\n    first_task = _project_state_task(first_payload, "MRL-0299")\n    assert f"canonical-main:{decision_base}" in first_task["evidence_refs"]\n\n    _run_git(repository, "checkout", "--quiet", "-b", "canonical-main-advance", decision_base)\n    roadmap = repository / _ROADMAP_PATH\n    roadmap.write_text(\n        roadmap.read_text(encoding="utf-8") + "\\n<!-- canonical-main anchor advance fixture -->\\n",\n        encoding="utf-8",\n    )\n    _run_git(repository, "add", _ROADMAP_PATH.as_posix())\n    _run_git(repository, "commit", "--quiet", "-m", "test: advance canonical main anchor")\n    advanced_main = _git_text(repository, "rev-parse", "HEAD")\n    _run_git(repository, "update-ref", "refs/remotes/origin/main", advanced_main)\n    _run_git(repository, "checkout", "--quiet", "--detach", decision_base)\n\n    second_dir = tmp_path / "second-anchor"\n    second = generate_machine_state(repository, second_dir)\n    second_payload = _load_project_state(second_dir / "PROJECT_STATE.json")\n    second_task = _project_state_task(second_payload, "MRL-0299")\n\n    assert second.commit_sha == first.commit_sha == decision_base\n    assert second.project_state != first.project_state\n    assert f"canonical-main:{advanced_main}" in second_task["evidence_refs"]\n    assert f"canonical-main:{decision_base}" not in second_task["evidence_refs"]\n\n    with pytest.raises(\n        MachineStateGenerationError,\n        match="independent canonical recomputation",\n    ):\n        admit_project_state_projection(repository, first.project_state)\n    admit_project_state_projection(repository, second.project_state)\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('canonical anchor regression insertion target is not unique')
          test_path.write_text(text.replace(marker, regression + marker, 1), encoding='utf-8')
          PY

      - name: Format and validate explicit evidence binding
        run: |
          uv run ruff format \
            src/medscale/mesc/_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_machine_state_ci_gate_v1.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy \
            src/medscale/mesc/_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_machine_state_ci_gate_v1.py
          uv run pytest -q \
            tests/test_mesc_mrl_machine_state_ci_gate_v1.py \
            tests/test_mesc_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_project_state_admission_v1.py

      - name: Verify exact repair scope
        run: |
          expected='src/medscale/mesc/_mrl_machine_state_generation_v1.py
          tests/test_mesc_mrl_machine_state_ci_gate_v1.py'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"

      - name: Commit and push explicit evidence binding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/medscale/mesc/_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_machine_state_ci_gate_v1.py
          git commit -m 'fix(mrl): bind canonical main evidence explicitly'
          git push origin HEAD:fix/mrl-7-project-state-contract-d36694
