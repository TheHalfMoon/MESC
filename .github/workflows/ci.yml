name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  eligibility-repair:
    if: github.repository == 'TheHalfMoon/MESC' && github.head_ref == 'fix/mrl-7-project-state-contract-d36694' && github.actor == 'TheHalfMoon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/mrl-7-project-state-contract-d36694
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Apply MRL-8 eligibility repair
        run: |
          python - <<'PY'
          from pathlib import Path

          generator = Path('src/medscale/mesc/_mrl_machine_state_generation_v1.py')
          text = generator.read_text(encoding='utf-8')
          old = '''_REAL_EVIDENCE: Final = frozenset({f"MRL-08{n:02d}" for n in range(1, 10)} | {"MRL-0899"})\n'''
          new = '''_REAL_EVIDENCE: Final = frozenset(f"MRL-08{n:02d}" for n in range(1, 9))\n'''
          if text.count(old) != 1:
              raise SystemExit('MRL-8 external-evidence mapping target is not unique')
          generator.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('tests/test_mesc_mrl_machine_state_generation_v1.py')
          text = test_path.read_text(encoding='utf-8')
          old_import = '''from medscale.mesc._mrl_machine_state_generation_v1 import (\n    MachineStateGenerationError,\n'''
          new_import = '''from medscale.mesc._mrl_machine_state_generation_v1 import (\n    _REAL_EVIDENCE,\n    MachineStateGenerationError,\n'''
          if text.count(old_import) != 1:
              raise SystemExit('generation test import target is not unique')
          text = text.replace(old_import, new_import, 1)
          marker = '''\ndef test_project_state_matches_frozen_schema_and_requalifies_stale_gates(\n'''
          regression = '''\ndef test_external_real_evidence_hold_excludes_dependency_only_gates() -> None:\n    assert _REAL_EVIDENCE == frozenset(\n        {\n            "MRL-0801",\n            "MRL-0802",\n            "MRL-0803",\n            "MRL-0804",\n            "MRL-0805",\n            "MRL-0806",\n            "MRL-0807",\n            "MRL-0808",\n        }\n    )\n    assert "MRL-0809" not in _REAL_EVIDENCE\n    assert "MRL-0899" not in _REAL_EVIDENCE\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('MRL-8 regression insertion point is not unique')
          test_path.write_text(text.replace(marker, regression + marker, 1), encoding='utf-8')
          PY

      - name: Format and validate eligibility repair
        run: |
          uv run ruff format \
            src/medscale/mesc/_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_machine_state_generation_v1.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy \
            src/medscale/mesc/_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_machine_state_generation_v1.py
          uv run pytest -q tests/test_mesc_mrl_machine_state_generation_v1.py

      - name: Verify exact repair scope
        run: |
          expected='src/medscale/mesc/_mrl_machine_state_generation_v1.py
          tests/test_mesc_mrl_machine_state_generation_v1.py'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"

      - name: Commit and push eligibility repair only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/medscale/mesc/_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_machine_state_generation_v1.py
          git commit -m 'fix(mrl): preserve dependency-only MRL-8 gate eligibility'
          git push origin HEAD:fix/mrl-7-project-state-contract-d36694
