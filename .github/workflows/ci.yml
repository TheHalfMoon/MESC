name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-repair:
    if: github.repository == 'TheHalfMoon/MESC' && github.head_ref == 'fix/mrl-7-project-state-contract-d36694' && github.actor == 'TheHalfMoon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/mrl-7-project-state-contract-d36694
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Apply Ruff formatting
        run: |
          uv run ruff format \
            src/medscale/mesc/_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_machine_state_ci_gate_v1.py \
            tests/test_mesc_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_project_state_admission_v1.py

      - name: Restore required CI workflow
        run: echo '' | base64 -d > .github/workflows/ci.yml

      - name: Verify exact diagnostic scope
        run: |
          expected='.github/workflows/ci.yml
          src/medscale/mesc/_mrl_machine_state_generation_v1.py
          tests/test_mesc_mrl_machine_state_ci_gate_v1.py
          tests/test_mesc_mrl_machine_state_generation_v1.py
          tests/test_mesc_mrl_project_state_admission_v1.py'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          uv run ruff check .
          uv run ruff format --check .

      - name: Commit formatted bytes and restored gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/ci.yml \
            src/medscale/mesc/_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_machine_state_ci_gate_v1.py \
            tests/test_mesc_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_project_state_admission_v1.py
          git commit -m 'style(mrl): apply Ruff formatting and restore CI gate'
          git push origin HEAD:fix/mrl-7-project-state-contract-d36694
