name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Apply Ruff formatter diagnostic
        run: |
          uv run ruff format \
            src/medscale/mesc/_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_machine_state_ci_gate_v1.py \
            tests/test_mesc_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_project_state_admission_v1.py

      - name: Upload formatted diagnostic files
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mrl7-ruff-formatted
          path: |
            src/medscale/mesc/_mrl_machine_state_generation_v1.py
            tests/test_mesc_mrl_machine_state_ci_gate_v1.py
            tests/test_mesc_mrl_machine_state_generation_v1.py
            tests/test_mesc_mrl_project_state_admission_v1.py
          if-no-files-found: error

      - name: Stop diagnostic run
        run: exit 1

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

      - name: MRL machine-state drift/manual-edit gate
        run: uv run pytest -q tests/test_mesc_mrl_machine_state_ci_gate_v1.py

      # ADR-0017: corpus<->log referential integrity is a hard gate, not a convention.
      - name: litdb integrity (medscale check)
        run: uv run medscale check
