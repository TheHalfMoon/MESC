name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Apply exact mypy fixes to PR 190 branch
        if: matrix.python-version == '3.12'
        env:
          TARGET_BRANCH: feat/mesc-hf-local-sft-backend-v1
        run: |
          git fetch origin "$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label} did not match exactly once")
              return text.replace(old, new, 1)

          source = Path("src/medscale/mesc/_training_hf_local_sft_backend_v1.py")
          text = source.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "for key, value in self.metrics:",
              "for key, metric_value in self.metrics:",
              label="metrics loop target",
          )
          text = replace_once(
              text,
              "if type(value) is not float:",
              "if type(metric_value) is not float:",
              label="metrics value target",
          )
          text = replace_once(
              text,
              "for key, value in self.packages:",
              "for key, package_value in self.packages:",
              label="packages loop target",
          )
          text = replace_once(
              text,
              '_require_text(value, field="runtime package version")',
              '_require_text(package_value, field="runtime package version")',
              label="package value target",
          )
          source.write_text(text, encoding="utf-8", newline="\n")

          tests = Path("tests/test_mesc_training_hf_local_sft_backend_v1.py")
          text = tests.read_text(encoding="utf-8")
          needle = '    records = (\n        {\n            "prompt": [{"role": "user", "content": "Question?"}],'
          replacement = (
              '    records: tuple[dict[str, object], ...] = (\n'
              '        {\n'
              '            "prompt": [{"role": "user", "content": "Question?"}],'
          )
          text = replace_once(text, needle, replacement, label="records annotation target")
          tests.write_text(text, encoding="utf-8", newline="\n")
          PY
          uv run ruff format \
            src/medscale/mesc/_training_hf_local_sft_backend_v1.py \
            tests/test_mesc_training_hf_local_sft_backend_v1.py
          uv run ruff check \
            src/medscale/mesc/_training_hf_local_sft_backend_v1.py \
            tests/test_mesc_training_hf_local_sft_backend_v1.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/medscale/mesc/_training_hf_local_sft_backend_v1.py \
            tests/test_mesc_training_hf_local_sft_backend_v1.py
          git commit -m "fix(mesc): satisfy strict typing for local SFT backend"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

      # ADR-0017: corpus<->log referential integrity is a hard gate, not a convention.
      - name: litdb integrity (medscale check)
        run: uv run medscale check
