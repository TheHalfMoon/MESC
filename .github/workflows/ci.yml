name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Apply exact Ruff format to PR 190 branch
        if: matrix.python-version == '3.12'
        run: |
          git fetch origin 8f6fffba3c21cca8b5efcbc73638b45f43f3cee5 --depth=1
          git checkout --detach 8f6fffba3c21cca8b5efcbc73638b45f43f3cee5
          uv run ruff format src/medscale/mesc/_training_hf_local_sft_backend_v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_training_hf_local_sft_backend_v1.py
          git diff --cached --quiet && exit 0
          git commit -m "style(mesc): format local HF SFT backend"
          git push origin HEAD:feat/mesc-hf-local-sft-backend-v1

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format diff diagnostic)
        run: uv run ruff format --diff src/medscale/mesc/_training_hf_local_sft_backend_v1.py || true

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

      # ADR-0017: corpus<->log referential integrity is a hard gate, not a convention.
      - name: litdb integrity (medscale check)
        run: uv run medscale check
