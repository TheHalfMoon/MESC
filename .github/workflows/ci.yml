name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: |
          if ! uv run ruff format --check .; then
            uv run ruff format --diff scripts/check_docs_links.py
            exit 1
          fi

      - name: Mypy (strict)
        run: uv run mypy

      - name: Docs link hygiene
        run: uv run python scripts/check_docs_links.py

      - name: MRL canonical closeout evidence live binding
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/mrl_closeout_evidence.py
          --verify specs/mesc-research-loop-v1/closeout-evidence-v1.json

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

      - name: MRL machine-state drift/manual-edit gate
        run: uv run pytest -q tests/test_mesc_mrl_machine_state_ci_gate_v1.py

      # ADR-0017: corpus<->log referential integrity is a hard gate, not a convention.
      - name: litdb integrity (medscale check)
        run: uv run medscale check
