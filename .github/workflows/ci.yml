name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  closeout-evidence-inventory:
    if: github.repository == 'TheHalfMoon/MESC' && github.head_ref == 'fix/mrl-7-project-state-contract-d36694'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Inventory canonical closeout transitions
        run: |
          uv run python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          import medscale.mesc._mrl_machine_state_generation_v1 as m

          root = Path('.').resolve()
          snapshot = m.load_canonical_snapshot(root)
          records = m._task_records(snapshot.source(m._TASKS).content)
          groups: dict[tuple[str, str], list[dict[str, object]]] = defaultdict(list)
          unresolved: list[str] = []
          for task_id, checked, dependencies in records:
              if not checked:
                  continue
              proof = m._closure_proof(
                  root,
                  snapshot.commit_sha,
                  snapshot.canonical_main_sha,
                  task_id,
              )
              if proof is None:
                  unresolved.append(task_id)
                  continue
              stale = m._stale(root, snapshot.commit_sha, task_id, proof[0])
              groups[proof].append(
                  {
                      'task_id': task_id,
                      'dependencies': list(dependencies),
                      'stale': stale,
                  }
              )
          payload = {
              'decision_base': snapshot.commit_sha,
              'canonical_main': snapshot.canonical_main_sha,
              'groups': [
                  {
                      'canonical_merge_sha': merge_sha,
                      'qualified_head_sha': head_sha,
                      'tasks': sorted(rows, key=lambda row: str(row['task_id'])),
                  }
                  for (merge_sha, head_sha), rows in sorted(groups.items())
              ],
              'checked_without_reproducible_merge_transition': sorted(unresolved),
          }
          print('MRL_CLOSEOUT_EVIDENCE_INVENTORY_BEGIN')
          print(json.dumps(payload, sort_keys=True, indent=2))
          print('MRL_CLOSEOUT_EVIDENCE_INVENTORY_END')
          PY
