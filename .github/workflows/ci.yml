name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Apply exact PR 190 path type repair
        if: matrix.python-version == '3.12'
        env:
          TARGET_BRANCH: feat/mesc-hf-local-sft-backend-v1
        run: |
          cp .github/pr190_path_repair.py /tmp/pr190_path_repair.py
          git fetch origin "$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"
          python /tmp/pr190_path_repair.py
          uv run ruff format \
            src/medscale/mesc/_training_hf_local_sft_backend_v1.py \
            tests/test_mesc_training_hf_local_sft_backend_v1.py
          uv run ruff check \
            src/medscale/mesc/_training_hf_local_sft_backend_v1.py \
            tests/test_mesc_training_hf_local_sft_backend_v1.py
          uv run mypy \
            src/medscale/mesc/_training_hf_local_sft_backend_v1.py \
            tests/test_mesc_training_hf_local_sft_backend_v1.py
          uv run pytest -q tests/test_mesc_training_hf_local_sft_backend_v1.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/medscale/mesc/_training_hf_local_sft_backend_v1.py \
            tests/test_mesc_training_hf_local_sft_backend_v1.py
          git commit -m "fix(mesc): accept concrete pathlib implementations"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

      # ADR-0017: corpus<->log referential integrity is a hard gate, not a convention.
      - name: litdb integrity (medscale check)
        run: uv run medscale check
