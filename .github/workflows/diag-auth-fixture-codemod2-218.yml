name: Auth fixture codemod diagnostic 2

on:
  push:
    branches:
      - diag/mesc-auth-format-218
    paths:
      - .github/workflows/diag-auth-fixture-codemod2-218.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Materialize fixture update and capture diagnostics
        shell: bash
        run: |
          set +e
          {
            cat > tests/_mesc_training_authorization_fixture.py <<'PY'
          """Synthetic training-authorization evidence for repository tests only.

          This helper never represents real founder/operator authority. It exists only so
          tests that exercise post-authorization code paths must provide canonical artifact
          bytes instead of relying on scalar ``authorize=True`` to mint authority.
          """

          from __future__ import annotations

          from medscale.mesc._canonical_json_v1 import canonical_json_bytes
          from medscale.mesc._training_authorization_receipt_v1 import (
              AuthorizationScope,
              TrainingAuthorizationReceipt,
              build_training_authorization_receipt as _build_training_authorization_receipt,
          )


          def build_training_authorization_receipt(
              *,
              authorizer_id: str,
              authorization_subject_sha256: str,
              runtime_qualification_sha256: str,
              corpus_binding_sha256: str,
              authorization_statement: str,
              authorization_scope: AuthorizationScope = "TRAINING_EXECUTION",
              authorize: bool,
          ) -> TrainingAuthorizationReceipt:
              """Build a receipt using explicit canonical synthetic artifact bytes when authorized."""
              artifact = None
              if authorize:
                  artifact = canonical_json_bytes(
                      {
                          "authorization_scope": authorization_scope,
                          "authorization_statement": authorization_statement,
                          "authorization_subject_sha256": authorization_subject_sha256,
                          "authorize": True,
                          "authorizer_id": authorizer_id,
                          "corpus_binding_sha256": corpus_binding_sha256,
                          "kind": "mesc.training_authorization.v1",
                          "runtime_qualification_sha256": runtime_qualification_sha256,
                      }
                  )
              return _build_training_authorization_receipt(
                  authorizer_id=authorizer_id,
                  authorization_subject_sha256=authorization_subject_sha256,
                  runtime_qualification_sha256=runtime_qualification_sha256,
                  corpus_binding_sha256=corpus_binding_sha256,
                  authorization_statement=authorization_statement,
                  authorization_scope=authorization_scope,
                  authorize=authorize,
                  authorization_artifact=artifact,
              )


          __all__ = ["build_training_authorization_receipt"]
          PY

            python - <<'PY'
          from pathlib import Path

          simple = (
              "tests/test_mesc_training_readiness_v1.py",
              "tests/test_mesc_training_launch_plan_v1.py",
              "tests/test_mesc_training_executor_v1.py",
              "tests/test_mesc_training_orchestrator_v1.py",
          )
          old_simple = """from medscale.mesc._training_authorization_receipt_v1 import (\n    build_training_authorization_receipt,\n)\n"""
          new_simple = "from tests._mesc_training_authorization_fixture import (\n    build_training_authorization_receipt,\n)\n"
          for name in simple:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if text.count(old_simple) != 1:
                  raise SystemExit(f"unexpected authorization import shape in {name}")
              path.write_text(text.replace(old_simple, new_simple), encoding="utf-8")

          binding = Path("tests/test_mesc_training_readiness_receipt_binding_v1.py")
          text = binding.read_text(encoding="utf-8")
          old_binding = """from medscale.mesc._training_authorization_receipt_v1 import (\n    TrainingAuthorizationReceipt,\n    build_training_authorization_receipt,\n)\n"""
          new_binding = """from medscale.mesc._training_authorization_receipt_v1 import (\n    TrainingAuthorizationReceipt,\n)\nfrom tests._mesc_training_authorization_fixture import (\n    build_training_authorization_receipt,\n)\n"""
          if text.count(old_binding) != 1:
              raise SystemExit("unexpected authorization import shape in readiness receipt binding tests")
          binding.write_text(text.replace(old_binding, new_binding), encoding="utf-8")
          PY

            files=(
              tests/_mesc_training_authorization_fixture.py
              tests/test_mesc_training_readiness_receipt_binding_v1.py
              tests/test_mesc_training_readiness_v1.py
              tests/test_mesc_training_launch_plan_v1.py
              tests/test_mesc_training_executor_v1.py
              tests/test_mesc_training_orchestrator_v1.py
            )
            uv run ruff check --fix "${files[@]}"
            uv run ruff format "${files[@]}"
            uv run ruff check "${files[@]}"
            uv run pytest -q "${files[@]}"
          } > codemod.log 2>&1
          rc=$?
          cat codemod.log
          printf '%s' "$rc" > codemod.rc
          exit 0

      - name: Upload codemod diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auth-fixture-codemod-diagnostic
          path: |
            codemod.log
            codemod.rc
          retention-days: 1
          if-no-files-found: error

      - name: Commit diagnostic fixture update
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat codemod.rc)" = "0"
          git config user.name "MESC diagnostic bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            tests/_mesc_training_authorization_fixture.py \
            tests/test_mesc_training_readiness_receipt_binding_v1.py \
            tests/test_mesc_training_readiness_v1.py \
            tests/test_mesc_training_launch_plan_v1.py \
            tests/test_mesc_training_executor_v1.py \
            tests/test_mesc_training_orchestrator_v1.py
          git diff --cached --check
          git commit -m "test(mesc): require explicit authorization artifacts in fixtures"
          git push origin HEAD:diag/mesc-auth-format-218
