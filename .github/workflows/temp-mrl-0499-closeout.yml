name: Temporary MRL 0499 Closeout

on:
  push:
    branches:
      - docs/mrl-0499-procedure-memory-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/mrl-0499-procedure-memory-closeout
          persist-credentials: true

      - name: Apply exact MRL-4 ledger closeout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("specs/mesc-research-loop-v1/tasks.md")
          text = path.read_text()
          task_ids = [*(f"MRL-040{i}" for i in range(1, 10)), "MRL-0499"]
          for task_id in task_ids:
              old = f"- [ ] **{task_id}"
              new = f"- [x] **{task_id}"
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one open ledger entry for {task_id}, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --numstat -- specs/mesc-research-loop-v1/tasks.md | awk '{print $1}')" = "10"
          test "$(git diff --numstat -- specs/mesc-research-loop-v1/tasks.md | awk '{print $2}')" = "10"

      - name: Commit ledger-only candidate and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-mrl-0499-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/mesc-research-loop-v1/tasks.md .github/workflows/temp-mrl-0499-closeout.yml
          git commit -m "docs(mrl): close procedure-memory exact-head gate"
          git push origin HEAD:docs/mrl-0499-procedure-memory-closeout
