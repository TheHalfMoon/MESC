name: MRL-0103 ledger closeout once

on:
  push:
    branches:
      - tmp/mrl-0103-ledger-closeout
    paths:
      - .github/workflows/mrl-0103-ledger-closeout-once.yml

permissions:
  contents: write

jobs:
  closeout-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: tmp/mrl-0103-ledger-closeout

      - name: Verify exact qualified source head
        shell: bash
        run: |
          set -euo pipefail
          expected=2283499fda2e3c121583fe84bed736216f9c5bac
          git cat-file -e "${expected}^{commit}"
          git merge-base --is-ancestor "$expected" HEAD
          changed="$(git diff --name-only "$expected" HEAD)"
          test "$changed" = ".github/workflows/mrl-0103-ledger-closeout-once.yml"

      - name: Apply exact ledger closeout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("specs/mesc-research-loop-v1/tasks.md")
          text = path.read_text()
          old = '''- [ ] **MRL-0103 — Implement `ResearchExperimentPlan`**\n  - Depends on: MRL-0102, MRL-0109.\n  - Test: mutation allow-list, budget, evaluator identities, evaluation tier, and exposure\n    allowance are frozen before execution.\n'''
          new = '''- [x] **MRL-0103 — Implement `ResearchExperimentPlan`**\n  - Depends on: MRL-0102, MRL-0109.\n  - Test: mutation allow-list, budget, evaluator identities, evaluation tier, and exposure\n    allowance are frozen before execution.\n  - Closeout rule: this checkbox is a branch closeout candidate only. `MRL-0103` becomes\n    `CLOSED_CANONICAL` only if the exact final head containing it passes fresh repository\n    checks and independent review, remains the exact PR head through expected-head merge,\n    and is then present on canonical `main`.\n  - Eligibility effect: MRL-0104 remains ineligible until MRL-0103 is\n    `CLOSED_CANONICAL` on canonical `main`.\n'''
          if text.count(old) != 1:
              raise SystemExit("MRL-0103 ledger block drifted")
          updated = text.replace(old, new, 1)
          if updated.count('- [x] **MRL-0103 — Implement `ResearchExperimentPlan`**') != 1:
              raise SystemExit("MRL-0103 closeout checkbox invariant failed")
          if '- [ ] **MRL-0104 — Bind existing `ExperimentManifest`**' not in updated:
              raise SystemExit("MRL-0104 eligibility was accidentally changed")
          path.write_text(updated)
          PY
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "specs/mesc-research-loop-v1/tasks.md "

      - name: Commit ledger closeout candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/mesc-research-loop-v1/tasks.md
          git diff --cached --check
          git commit -m "docs(mrl): mark MRL-0103 closeout candidate"
          git push origin HEAD:tmp/mrl-0103-ledger-closeout
