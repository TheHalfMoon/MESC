name: Temporary Ruff Format 311

on:
  push:
    branches:
      - feat/mrl-0607-canary-recycling-08c5e1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mrl-0607-canary-recycling-08c5e1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Apply canonical Ruff formatting
        run: uv run ruff format src/medscale/mesc/_mrl_canary_recycling_guard_v1.py
      - name: Remove temporary workflow and commit formatting
        run: |
          rm .github/workflows/temp-ruff-format-311.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_mrl_canary_recycling_guard_v1.py .github/workflows/temp-ruff-format-311.yml
          git commit -m "style(mrl): format canary recycling guard"
          git push origin HEAD:feat/mrl-0607-canary-recycling-08c5e1
