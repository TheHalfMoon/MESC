name: diag MRL-0510 performance repair v2

on:
  push:
    branches:
      - diag/mrl-0510-performance-fix-v2-40593d

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync (locked)
        run: uv sync --frozen
      - name: Apply narrow validation repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/medscale/mesc/_mrl_researcher_comparison_report_v1.py")
          source = source_path.read_text()
          class_start = source.index("class ResearcherComparisonReport:")
          class_end = source.index("\ndef build_researcher_comparison_report(\n", class_start)
          prefix = source[:class_start]
          section = source[class_start:class_end]
          suffix = source[class_end:]

          old = '''    def _validated_snapshot(self) -> ResearcherComparisonReport:\n        if type(self) is not ResearcherComparisonReport:\n            raise ResearcherComparisonReportError(\n                "report must be an exact ResearcherComparisonReport"\n            )\n        bound = _load_identity(self, "researcher comparison report")\n        _validate_report(self)\n        current = derive_content_sha256(self._semantic_dict_validated())\n        if current != bound:\n            raise ResearcherComparisonReportError(\n                "researcher comparison report changed after construction"\n            )\n        return self\n\n    @property\n    def content_sha256(self) -> str:\n        return derive_content_sha256(self.semantic_dict())\n\n    @property\n    def semantic_bytes(self) -> bytes:\n        return canonical_semantic_bytes(self.semantic_dict())\n'''
          new = '''    def _validated_semantic_dict(self) -> dict[str, object]:\n        if type(self) is not ResearcherComparisonReport:\n            raise ResearcherComparisonReportError(\n                "report must be an exact ResearcherComparisonReport"\n            )\n        bound = _load_identity(self, "researcher comparison report")\n        _validate_report(self)\n        data = self._semantic_dict_validated()\n        current = derive_content_sha256(data)\n        if current != bound:\n            raise ResearcherComparisonReportError(\n                "researcher comparison report changed after construction"\n            )\n        return data\n\n    def _validated_snapshot(self) -> ResearcherComparisonReport:\n        self._validated_semantic_dict()\n        return self\n\n    @property\n    def content_sha256(self) -> str:\n        return derive_content_sha256(self._validated_semantic_dict())\n\n    @property\n    def semantic_bytes(self) -> bytes:\n        return canonical_semantic_bytes(self._validated_semantic_dict())\n'''
          if section.count(old) != 1:
              raise SystemExit(f"expected validation block once, found {section.count(old)}")
          section = section.replace(old, new)

          old = '''    def semantic_dict(self) -> dict[str, object]:\n        return self._validated_snapshot()._semantic_dict_validated()\n'''
          new = '''    def semantic_dict(self) -> dict[str, object]:\n        return self._validated_semantic_dict()\n'''
          if section.count(old) != 1:
              raise SystemExit(f"expected report semantic_dict once, found {section.count(old)}")
          section = section.replace(old, new)

          old = '''        report = self._validated_snapshot()\n        observations = _observations_by_arm(report.contexts)\n        universal_metrics = _universally_available_metric_names(observations)\n        pareto = _pareto_frontier_from_observations(observations, universal_metrics)\n        first_run = report.contexts[0].benchmark_run._validated_snapshot()\n\n        lines = [\n'''
          new = '''        semantic = self._validated_semantic_dict()\n        observations = _observations_by_arm(self.contexts)\n        universal_metrics = _universally_available_metric_names(observations)\n        pareto = _pareto_frontier_from_observations(observations, universal_metrics)\n        first_run = self.contexts[0].benchmark_run._validated_snapshot()\n        report_sha256 = derive_content_sha256(semantic)\n\n        lines = [\n'''
          if section.count(old) != 1:
              raise SystemExit(f"expected markdown prelude once, found {section.count(old)}")
          section = section.replace(old, new)
          old = '            f"- Report SHA-256: `{report.content_sha256}`",\n'
          new = '            f"- Report SHA-256: `{report_sha256}`",\n'
          if section.count(old) != 1:
              raise SystemExit(f"expected markdown digest once, found {section.count(old)}")
          section = section.replace(old, new)
          source_path.write_text(prefix + section + suffix)

          test_path = Path("tests/test_mesc_mrl_researcher_comparison_report_v1.py")
          tests = test_path.read_text()
          old = '''    first = build_researcher_comparison_report(_contexts(monkeypatch))\n    second = build_researcher_comparison_report(_contexts(monkeypatch))\n\n    assert first.semantic_bytes == second.semantic_bytes\n    assert first.content_sha256 == second.content_sha256\n    assert first.render_markdown() == second.render_markdown()\n\n    markdown = first.render_markdown()\n    assert markdown.startswith("# MRL Researcher Comparison Report V1\\n")\n    assert "N/A" in markdown\n    assert "fixture-only" in markdown\n    assert "hidden agent cognition" in markdown\n    assert first.content_sha256 in markdown\n'''
          new = '''    contexts = _contexts(monkeypatch)\n    first = build_researcher_comparison_report(contexts)\n    second = build_researcher_comparison_report(contexts)\n\n    first_semantic_bytes = first.semantic_bytes\n    first_content_sha256 = first.content_sha256\n    first_markdown = first.render_markdown()\n    assert first_semantic_bytes == second.semantic_bytes\n    assert first_content_sha256 == second.content_sha256\n    assert first_markdown == second.render_markdown()\n\n    assert first_markdown.startswith("# MRL Researcher Comparison Report V1\\n")\n    assert "N/A" in first_markdown\n    assert "fixture-only" in first_markdown\n    assert "hidden agent cognition" in first_markdown\n    assert first_content_sha256 in first_markdown\n'''
          if tests.count(old) != 1:
              raise SystemExit(f"expected markdown test block once, found {tests.count(old)}")
          test_path.write_text(tests.replace(old, new))
          PY
      - name: Canonical format
        run: uv run ruff format src/medscale/mesc/_mrl_researcher_comparison_report_v1.py tests/test_mesc_mrl_researcher_comparison_report_v1.py
      - name: Ruff lint
        run: uv run ruff check .
      - name: Strict mypy
        run: uv run mypy
      - name: Focused Python 3.11 tests
        run: >-
          uv run pytest -q
          tests/test_mesc_mrl_researcher_comparison_report_v1.py
          tests/test_mesc_mrl_researcher_arm_context_v1.py
          tests/test_mesc_mrl_researcher_benchmark_v1.py
      - name: Remove diagnostic workflow and commit repair
        if: success()
        shell: bash
        run: |
          rm .github/workflows/diag-mrl-0510-performance-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_mrl_researcher_comparison_report_v1.py tests/test_mesc_mrl_researcher_comparison_report_v1.py .github/workflows/diag-mrl-0510-performance-fix-v2.yml
          git commit -m "fix(mrl): avoid repeated MRL-0510 semantic derivation"
          git push origin HEAD:diag/mrl-0510-performance-fix-v2-40593d
