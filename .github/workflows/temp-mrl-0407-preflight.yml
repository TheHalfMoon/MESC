name: Temporary MRL 0407 Preflight

on:
  push:
    branches:
      - feat/mrl-0407-procedure-registry-f9f535

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mrl-0407-procedure-registry-f9f535
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Apply deterministic registry repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/medscale/mesc/_mrl_procedure_registry_v1.py")
          text = path.read_text()
          old = "return ProcedureRegistry(events=registry.events + (event,))"
          new = "return ProcedureRegistry(events=(*registry.events, event))"
          if text.count(old) != 1:
              raise SystemExit("expected registry tuple append exactly once")
          path.write_text(text.replace(old, new))
          PY

      - name: Format and lint
        run: |
          uv run ruff format \
            src/medscale/mesc/_mrl_procedure_registry_v1.py \
            tests/test_mesc_mrl_procedure_registry_v1.py
          uv run ruff check --fix \
            src/medscale/mesc/_mrl_procedure_registry_v1.py \
            tests/test_mesc_mrl_procedure_registry_v1.py
          uv run ruff format \
            src/medscale/mesc/_mrl_procedure_registry_v1.py \
            tests/test_mesc_mrl_procedure_registry_v1.py
          uv run ruff check \
            src/medscale/mesc/_mrl_procedure_registry_v1.py \
            tests/test_mesc_mrl_procedure_registry_v1.py

      - name: Strict mypy
        run: uv run mypy

      - name: Focused pytest
        run: |
          uv run pytest -q \
            tests/test_mesc_mrl_procedure_registry_v1.py \
            tests/test_mesc_mrl_procedure_admission_gate_v1.py

      - name: Commit qualified files and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-mrl-0407-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_mrl_procedure_registry_v1.py \
                  tests/test_mesc_mrl_procedure_registry_v1.py \
                  .github/workflows/temp-mrl-0407-preflight.yml
          git commit -m "style(mrl): qualify MRL-0407 registry"
          git push origin HEAD:feat/mrl-0407-procedure-registry-f9f535
