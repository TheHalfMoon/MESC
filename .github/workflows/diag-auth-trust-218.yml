name: Auth trust registry diagnostic

on:
  push:
    branches:
      - diag/mesc-auth-trust-218
    paths:
      - .github/workflows/diag-auth-trust-218.yml
      - scripts/diag_auth_trust_registry_218.py
      - scripts/run_diag_auth_trust_registry_218.py
      - src/medscale/mesc/_training_authorization_trust_v1.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Apply trust-registry repair
        run: uv run python scripts/run_diag_auth_trust_registry_218.py
      - name: Ruff fix and format
        run: |
          uv run ruff check --fix src/medscale/mesc/_training_authorization_trust_v1.py src/medscale/mesc/_training_authorization_receipt_v1.py tests/test_mesc_training_authorization_receipt_v1.py tests/test_mesc_training_readiness_receipt_binding_v1.py tests/test_mesc_training_readiness_v1.py tests/test_mesc_training_launch_plan_v1.py tests/test_mesc_training_executor_v1.py tests/test_mesc_training_orchestrator_v1.py
          uv run ruff format src/medscale/mesc/_training_authorization_trust_v1.py src/medscale/mesc/_training_authorization_receipt_v1.py tests/test_mesc_training_authorization_receipt_v1.py tests/test_mesc_training_readiness_receipt_binding_v1.py tests/test_mesc_training_readiness_v1.py tests/test_mesc_training_launch_plan_v1.py tests/test_mesc_training_executor_v1.py tests/test_mesc_training_orchestrator_v1.py
          uv run ruff check . --exclude scripts/diag_auth_trust_registry_218.py --exclude scripts/run_diag_auth_trust_registry_218.py
          uv run ruff format --check . --exclude scripts/diag_auth_trust_registry_218.py --exclude scripts/run_diag_auth_trust_registry_218.py
      - name: Mypy strict
        run: uv run mypy src tests scripts --exclude '^scripts/(diag_auth_trust_registry_218|run_diag_auth_trust_registry_218)\.py$'
      - name: Targeted authorization tests
        run: uv run pytest -q tests/test_mesc_training_authorization_receipt_v1.py tests/test_mesc_training_readiness_receipt_binding_v1.py tests/test_mesc_training_readiness_v1.py tests/test_mesc_training_launch_plan_v1.py tests/test_mesc_training_executor_v1.py tests/test_mesc_training_orchestrator_v1.py
      - name: Full pytest
        run: uv run pytest --cov --cov-report=term-missing
      - name: MedScale integrity
        run: uv run medscale check
      - name: Commit validated repair bytes
        run: |
          set -euo pipefail
          git config user.name "MESC diagnostic bot"
          git config user.email "actions@users.noreply.github.com"
          git add specs/mesc-training-authorization-receipt-v1/README.md src/medscale/mesc/_training_authorization_trust_v1.py src/medscale/mesc/_training_authorization_receipt_v1.py tests/test_mesc_training_authorization_receipt_v1.py tests/test_mesc_training_readiness_receipt_binding_v1.py tests/test_mesc_training_readiness_v1.py tests/test_mesc_training_launch_plan_v1.py tests/test_mesc_training_executor_v1.py tests/test_mesc_training_orchestrator_v1.py
          git diff --cached --check
          git commit -m "fix(mesc): require canonical authorization trust registry"
          git push origin HEAD:diag/mesc-auth-trust-218
