name: Temporary Ruff Format 309

on:
  push:
    branches:
      - fix/mrl-0602-0603-0605-4806fc

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mrl-0602-0603-0605-4806fc
          persist-credentials: true
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Apply canonical Ruff formatting
        run: |
          uv run ruff format src/medscale/mesc/_mrl_contamination_interfaces_v1.py src/medscale/mesc/_mrl_temporal_canary_manifest_v1.py
      - name: Remove temporary workflow and commit formatting
        run: |
          rm .github/workflows/temp-ruff-format-309.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_mrl_contamination_interfaces_v1.py src/medscale/mesc/_mrl_temporal_canary_manifest_v1.py .github/workflows/temp-ruff-format-309.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(mrl): apply canonical Ruff formatting"
          git push origin HEAD:fix/mrl-0602-0603-0605-4806fc
