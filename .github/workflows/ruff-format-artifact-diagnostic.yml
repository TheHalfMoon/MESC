name: Ruff Format Artifact Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-candidates:
    name: format candidate files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Apply Ruff formatter to diagnostic copies
        run: |
          uv run ruff format \
            src/medscale/mesc/_mrl_hard_medical_non_regression_v1.py \
            tests/test_mesc_mrl_hard_medical_non_regression_v1.py \
            src/medscale/mesc/_mrl_adaptive_budget_exhaustion_v1.py \
            tests/test_mesc_mrl_adaptive_budget_exhaustion_v1.py \
            tests/test_mesc_mrl_machine_state_ci_gate_v1.py

      - name: Upload formatted candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-formatted-candidates
          path: |
            src/medscale/mesc/_mrl_hard_medical_non_regression_v1.py
            tests/test_mesc_mrl_hard_medical_non_regression_v1.py
            src/medscale/mesc/_mrl_adaptive_budget_exhaustion_v1.py
            tests/test_mesc_mrl_adaptive_budget_exhaustion_v1.py
            tests/test_mesc_mrl_machine_state_ci_gate_v1.py
          if-no-files-found: error
