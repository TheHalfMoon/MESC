name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  quality:
    name: quality gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q --no-header

  build:
    name: build artifacts
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync
        run: uv sync --frozen
      - name: Build wheel + sdist
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.ref_name }}
          path: dist/*
          retention-days: 30

  github-release:
    name: GitHub Release
    needs: [quality, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.ref_name }}
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

  pr-artifact-build:
    name: PR-safe build and upload qualification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync
        run: uv sync --frozen
      - name: Build wheel + sdist
        run: uv build
      - name: Prepare byte-identity payload
        shell: bash
        run: |
          mkdir roundtrip-payload
          cp dist/* roundtrip-payload/
          (cd roundtrip-payload && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Upload qualification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-action-roundtrip-${{ github.event.pull_request.number }}
          path: roundtrip-payload/
          retention-days: 1

  pr-artifact-roundtrip:
    name: PR-safe download and byte-identity qualification
    if: github.event_name == 'pull_request'
    needs: pr-artifact-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download qualification artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-action-roundtrip-${{ github.event.pull_request.number }}
          path: roundtrip
      - name: Verify byte identity
        shell: bash
        run: |
          cd roundtrip
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -type f -name '*.whl' | wc -l)" -ge 1
          test "$(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -ge 1
