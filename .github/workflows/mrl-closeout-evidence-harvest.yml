name: MRL closeout evidence harvest

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read
  statuses: read

jobs:
  strict-closeout-evidence-harvest:
    if: github.repository == 'TheHalfMoon/MESC' && github.head_ref == 'fix/mrl-7-project-state-contract-d36694'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Reproduce historical evidence and exact Ruff formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics/formatted
          python scripts/mrl_closeout_evidence.py > diagnostics/closeout-evidence-v1.json
          uvx --from ruff==0.15.21 ruff format \
            scripts/mrl_closeout_evidence.py \
            src/medscale/mesc/_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_closeout_evidence_v1.py
          cp scripts/mrl_closeout_evidence.py diagnostics/formatted/mrl_closeout_evidence.py
          cp src/medscale/mesc/_mrl_machine_state_generation_v1.py \
            diagnostics/formatted/_mrl_machine_state_generation_v1.py
          cp tests/test_mesc_mrl_closeout_evidence_v1.py \
            diagnostics/formatted/test_mesc_mrl_closeout_evidence_v1.py
          cp diagnostics/closeout-evidence-v1.json \
            specs/mesc-research-loop-v1/closeout-evidence-v1.json

      - name: Commit verified branch-only artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/mrl_closeout_evidence.py \
            src/medscale/mesc/_mrl_machine_state_generation_v1.py \
            tests/test_mesc_mrl_closeout_evidence_v1.py \
            specs/mesc-research-loop-v1/closeout-evidence-v1.json
          if git diff --cached --quiet; then
            echo "Verified artifact already matches the branch."
            exit 0
          fi
          git commit -m "style(mrl): apply verified closeout artifact"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload verified diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mrl-closeout-evidence-and-formatting
          path: diagnostics
          if-no-files-found: error
          retention-days: 1
