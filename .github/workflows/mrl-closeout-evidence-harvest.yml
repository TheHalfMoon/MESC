name: MRL closeout evidence harvest

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: read

jobs:
  strict-closeout-evidence-harvest:
    if: github.repository == 'TheHalfMoon/MESC' && github.head_ref == 'fix/mrl-7-project-state-contract-d36694'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reproduce independently verified historical closeout evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/mrl_closeout_evidence.py
