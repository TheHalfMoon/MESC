name: MRL closeout evidence harvest

on:
  push:
    branches:
      - reconcile/mrl-0399-0799-evidence-c090aa

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Harvest canonical MRL closeout evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-parse --verify refs/remotes/origin/main
          mkdir -p .mrl-evidence
          uv run python scripts/mrl_closeout_evidence.py > .mrl-evidence/closeout-evidence-v1.json

      - name: Upload harvested evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mrl-closeout-evidence
          path: .mrl-evidence/closeout-evidence-v1.json
          if-no-files-found: error
          retention-days: 1
