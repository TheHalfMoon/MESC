name: Ops MRL-0801 atomic support fix

on:
  push:
    branches:
      - ops/mrl-0801-atomic-support-fix-20260908

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ops patcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/mrl-0801-atomic-support-fix-20260908
          path: ops
          fetch-depth: 1
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mrl-0801-hf-acquisition-executor-20260908
          path: target
          fetch-depth: 0
      - name: Guard exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='6bec0917449b0911eb4b94207bed0ab34b5f0e7a'
          test "$(git -C target rev-parse HEAD)" = "$expected"
          test "$(git -C target ls-remote origin refs/heads/feat/mrl-0801-hf-acquisition-executor-20260908 | cut -f1)" = "$expected"
      - name: Apply deterministic support patch
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python ../ops/.github/ops/mrl_0801_atomic_support_fix.py
          python -m compileall -q src/medscale/mesc/_mrl_0801_hf_acquisition_v1.py scripts/mesc_mrl_0801_hf_acquire.py
          git diff --check
      - name: Guard and push one fast-forward commit
        shell: bash
        run: |
          set -euo pipefail
          expected='6bec0917449b0911eb4b94207bed0ab34b5f0e7a'
          test "$(git -C target ls-remote origin refs/heads/feat/mrl-0801-hf-acquisition-executor-20260908 | cut -f1)" = "$expected"
          git -C target config user.name 'github-actions[bot]'
          git -C target config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C target add src/medscale/mesc/_mrl_0801_hf_acquisition_v1.py scripts/mesc_mrl_0801_hf_acquire.py
          git -C target commit -m 'fix(mesc): preflight atomic publication support'
          git -C target push origin HEAD:refs/heads/feat/mrl-0801-hf-acquisition-executor-20260908
