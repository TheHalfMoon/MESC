name: Temporary MRL 0510 Preflight

on:
  push:
    branches: [feat/mrl-0510-researcher-comparison-report-388bd9]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mrl-0510-researcher-comparison-report-388bd9
          persist-credentials: true
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Format and safe lint fixes
        run: |
          uv run ruff format src/medscale/mesc/_mrl_researcher_comparison_report_v1.py tests/test_mesc_mrl_researcher_comparison_report_v1.py
          uv run ruff check --fix src/medscale/mesc/_mrl_researcher_comparison_report_v1.py tests/test_mesc_mrl_researcher_comparison_report_v1.py
          uv run ruff check src/medscale/mesc/_mrl_researcher_comparison_report_v1.py tests/test_mesc_mrl_researcher_comparison_report_v1.py
      - name: Strict mypy
        run: uv run mypy
      - name: Focused pytest
        run: >-
          uv run pytest -q
          tests/test_mesc_mrl_researcher_comparison_report_v1.py
          tests/test_mesc_mrl_researcher_arm_context_v1.py
          tests/test_mesc_mrl_researcher_benchmark_v1.py
      - name: Commit qualified files and remove temporary workflow
        run: |
          rm .github/workflows/temp-mrl-0510-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_mrl_researcher_comparison_report_v1.py tests/test_mesc_mrl_researcher_comparison_report_v1.py .github/workflows/temp-mrl-0510-preflight.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(mrl): qualify MRL-0510 comparison report"
          git push origin HEAD:feat/mrl-0510-researcher-comparison-report-388bd9
