name: Temporary MRL 0408 Preflight

on:
  push:
    branches:
      - feat/mrl-0408-procedure-search-index-a8990b

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mrl-0408-procedure-search-index-a8990b
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Apply deterministic typing repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/medscale/mesc/_mrl_procedure_search_index_v1.py")
          text = path.read_text()
          replacements = {
              "admission = admission_by_artifact.get(admitted_sha256)": "matched_admission = admission_by_artifact.get(admitted_sha256)",
              "if admission is None:\n            raise ProcedureSearchIndexError(\n                \"every active admitted procedure requires research-input admission\"\n            )": "if matched_admission is None:\n            raise ProcedureSearchIndexError(\n                \"every active admitted procedure requires research-input admission\"\n            )",
              "_stable_search_admission_sha256(admission)": "_stable_search_admission_sha256(matched_admission)",
              "used_admissions.append(admission)": "used_admissions.append(matched_admission)",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected search-index typing target exactly once: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Format and safe lint fixes
        run: |
          uv run ruff format \
            src/medscale/mesc/_mrl_procedure_search_index_v1.py \
            tests/test_mesc_mrl_procedure_search_index_v1.py
          uv run ruff check --fix \
            src/medscale/mesc/_mrl_procedure_search_index_v1.py \
            tests/test_mesc_mrl_procedure_search_index_v1.py
          uv run ruff format \
            src/medscale/mesc/_mrl_procedure_search_index_v1.py \
            tests/test_mesc_mrl_procedure_search_index_v1.py
          uv run ruff check \
            src/medscale/mesc/_mrl_procedure_search_index_v1.py \
            tests/test_mesc_mrl_procedure_search_index_v1.py

      - name: Strict mypy
        run: uv run mypy

      - name: Focused pytest
        run: |
          uv run pytest -q \
            tests/test_mesc_mrl_procedure_search_index_v1.py \
            tests/test_mesc_mrl_procedure_registry_v1.py \
            tests/test_mesc_mrl_research_input_admission_v1.py

      - name: Commit qualified files and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-mrl-0408-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_mrl_procedure_search_index_v1.py \
                  tests/test_mesc_mrl_procedure_search_index_v1.py \
                  .github/workflows/temp-mrl-0408-preflight.yml
          git commit -m "style(mrl): qualify MRL-0408 search index"
          git push origin HEAD:feat/mrl-0408-procedure-search-index-a8990b
