name: Guarded MRL-0801 rollback regression alignment

on:
  push:
    branches:
      - ops/mrl-0801-owned-rollback-fix-20260908

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out operations branch
        uses: actions/checkout@v4
        with:
          path: ops

      - name: Stage deterministic test fixer
        run: |
          set -euo pipefail
          cp ops/.github/ops/fix_mrl_0801_final_tests.py "$RUNNER_TEMP/fixer.py"
          python -m py_compile "$RUNNER_TEMP/fixer.py"

      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/mrl-0801-hf-acquisition-executor-20260908
          fetch-depth: 0
          path: target

      - name: Verify expected PR head
        working-directory: target
        env:
          EXPECTED_HEAD: 9312c86341f4fc0992f4ae246a381abdb7fd77fe
          TARGET_BRANCH: feat/mrl-0801-hf-acquisition-executor-20260908
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Apply deterministic regression alignment
        working-directory: target
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/fixer.py"
          python -m py_compile \
            tests/test_mesc_mrl_0801_hf_mount_rollback_v1.py \
            tests/test_mesc_mrl_0801_hf_publish_v1.py
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Commit and guarded fast-forward push
        working-directory: target
        env:
          EXPECTED_HEAD: 9312c86341f4fc0992f4ae246a381abdb7fd77fe
          TARGET_BRANCH: feat/mrl-0801-hf-acquisition-executor-20260908
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_mesc_mrl_0801_hf_mount_rollback_v1.py \
            tests/test_mesc_mrl_0801_hf_publish_v1.py
          git commit -m "test(mesc): align rollback regressions with owned cleanup"
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
