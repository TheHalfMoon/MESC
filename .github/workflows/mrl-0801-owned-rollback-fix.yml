name: Guarded MRL-0801 rollback hardening

on:
  push:
    branches:
      - ops/mrl-0801-owned-rollback-fix-20260908

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/mrl-0801-hf-acquisition-executor-20260908
          fetch-depth: 0

      - name: Verify expected PR head
        env:
          EXPECTED_HEAD: 524516e9d16a00dd8d08967f129d559d33951155
          TARGET_BRANCH: feat/mrl-0801-hf-acquisition-executor-20260908
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Apply deterministic ownership-bound rollback patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          core = "src/medscale/mesc/_mrl_0801_hf_acquisition_v1.py"

          replace_once(
              core,
              '''    path: str
    byte_count: int
    remote_etag: str
    remote_etag_algorithm: str
    local_sha256: str

    def to_dict(self) -> dict[str, object]:
''',
              '''    path: str
    byte_count: int
    remote_etag: str
    remote_etag_algorithm: str
    local_sha256: str
    owned_device: int | None = field(default=None, repr=False, compare=False)
    owned_inode: int | None = field(default=None, repr=False, compare=False)

    def to_dict(self) -> dict[str, object]:
''',
          )

          replace_once(
              core,
              '''def _unlink_descriptor_entry(*, root_fd: int, name: str) -> None:
    try:
        os.unlink(name, dir_fd=root_fd)
    except FileNotFoundError:
        return


def _publish_partial_no_replace(*, root_fd: int, partial_name: str, target_name: str) -> None:
    try:
        os.link(
            partial_name,
            target_name,
            src_dir_fd=root_fd,
            dst_dir_fd=root_fd,
            follow_symlinks=False,
        )
    except FileExistsError:
        raise MRL0801HfAcquisitionError(
            "executor refuses to overwrite an asset file created during publication"
        ) from None
    except OSError:
        raise MRL0801HfAcquisitionError("asset publication failed safely") from None
    try:
        os.unlink(partial_name, dir_fd=root_fd)
    except OSError:
        _unlink_descriptor_entry(root_fd=root_fd, name=target_name)
        raise
''',
              '''def _descriptor_entry_stat(*, root_fd: int, name: str) -> os.stat_result | None:
    try:
        return os.stat(name, dir_fd=root_fd, follow_symlinks=False)
    except FileNotFoundError:
        return None
    except OSError:
        raise MRL0801HfAcquisitionError(
            "acquisition destination entry could not be inspected safely"
        ) from None


def _unlink_descriptor_entry_if_owned(
    *,
    root_fd: int,
    name: str,
    expected_identity: tuple[int, int],
) -> bool:
    observed = _descriptor_entry_stat(root_fd=root_fd, name=name)
    if (
        observed is None
        or not stat.S_ISREG(observed.st_mode)
        or _stat_descriptor_identity(observed) != expected_identity
    ):
        return False
    try:
        os.unlink(name, dir_fd=root_fd)
    except FileNotFoundError:
        return False
    return True


def _publish_partial_no_replace(
    *,
    root_fd: int,
    partial_name: str,
    target_name: str,
    expected_identity: tuple[int, int],
) -> tuple[int, int]:
    try:
        os.link(
            partial_name,
            target_name,
            src_dir_fd=root_fd,
            dst_dir_fd=root_fd,
            follow_symlinks=False,
        )
    except FileExistsError:
        raise MRL0801HfAcquisitionError(
            "executor refuses to overwrite an asset file created during publication"
        ) from None
    except OSError:
        raise MRL0801HfAcquisitionError("asset publication failed safely") from None

    published = _descriptor_entry_stat(root_fd=root_fd, name=target_name)
    if (
        published is None
        or not stat.S_ISREG(published.st_mode)
        or _stat_descriptor_identity(published) != expected_identity
    ):
        _unlink_descriptor_entry_if_owned(
            root_fd=root_fd,
            name=partial_name,
            expected_identity=expected_identity,
        )
        raise MRL0801HfAcquisitionError(
            "published asset identity changed during publication"
        )

    try:
        if not _unlink_descriptor_entry_if_owned(
            root_fd=root_fd,
            name=partial_name,
            expected_identity=expected_identity,
        ):
            raise MRL0801HfAcquisitionError(
                "partial acquisition identity changed during publication"
            )
    except BaseException:
        _unlink_descriptor_entry_if_owned(
            root_fd=root_fd,
            name=target_name,
            expected_identity=expected_identity,
        )
        raise

    published = _descriptor_entry_stat(root_fd=root_fd, name=target_name)
    if (
        published is None
        or not stat.S_ISREG(published.st_mode)
        or _stat_descriptor_identity(published) != expected_identity
    ):
        raise MRL0801HfAcquisitionError(
            "published asset identity changed after publication"
        )
    return expected_identity
''',
          )

          replace_once(
