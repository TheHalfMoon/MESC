name: Guarded MRL-0801 rollback hardening

on:
  push:
    branches:
      - ops/mrl-0801-owned-rollback-fix-20260908

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out operations branch
        uses: actions/checkout@v4
        with:
          path: ops

      - name: Stage deterministic patcher
        run: |
          set -euo pipefail
          cp ops/.github/ops/apply_mrl_0801_owned_rollback_fix.py "$RUNNER_TEMP/patcher.py"
          python -m py_compile "$RUNNER_TEMP/patcher.py"

      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/mrl-0801-hf-acquisition-executor-20260908
          fetch-depth: 0
          path: target

      - name: Verify expected PR head
        working-directory: target
        env:
          EXPECTED_HEAD: 524516e9d16a00dd8d08967f129d559d33951155
          TARGET_BRANCH: feat/mrl-0801-hf-acquisition-executor-20260908
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Apply deterministic ownership-bound rollback patch
        working-directory: target
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/patcher.py"

      - name: Verify patch syntax and whitespace
        working-directory: target
        run: |
          set -euo pipefail
          python -m py_compile \
            src/medscale/mesc/_mrl_0801_hf_acquisition_v1.py \
            tests/test_mesc_mrl_0801_hf_publish_v1.py \
            tests/test_mesc_mrl_0801_hf_mount_rollback_v1.py \
            tests/test_mesc_mrl_0801_hf_acquisition_v1.py
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Commit and guarded fast-forward push
        working-directory: target
        env:
          EXPECTED_HEAD: 524516e9d16a00dd8d08967f129d559d33951155
          TARGET_BRANCH: feat/mrl-0801-hf-acquisition-executor-20260908
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/medscale/mesc/_mrl_0801_hf_acquisition_v1.py \
            tests/test_mesc_mrl_0801_hf_publish_v1.py \
            tests/test_mesc_mrl_0801_hf_mount_rollback_v1.py \
            tests/test_mesc_mrl_0801_hf_acquisition_v1.py \
            specs/mesc-experiment-0/mrl-0801-hf-acquisition-provenance-v1.md
          git commit -m "fix(mesc): bind rollback cleanup to owned entries"
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
