name: Diagnostic MESC 218 Ruff Format

on:
  push:
    branches:
      - diag/mesc-218-ruff-format-d488c639

permissions:
  contents: write

jobs:
  format-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Materialize exact Ruff formatter output on diagnostic branch
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format .
          git diff --check
          git add -- \
            src/medscale/mesc/_training_authorization_receipt_v1.py \
            src/medscale/mesc/_training_executor_v1.py \
            tests/_training_authorization_test_support.py \
            tests/test_mesc_training_authorization_admission_guard_v1.py
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(diag): materialize Ruff formatter output"
          git push origin HEAD:${GITHUB_REF_NAME}
