name: Diagnostic MRL-0205 Mypy Repair Output

on:
  push:
    branches:
      - diag/mrl-0205-ruff-format

permissions:
  contents: write

jobs:
  mypy-repair-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/mrl-0205-replication-retained-lead
          fetch-depth: 0

      - name: Require exact implementation head
        run: test "$(git rev-parse HEAD)" = "aaca7b81ba5fd796897824f8aa930c3af42e30f5"

      - name: Apply narrow typing repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_mesc_mrl_fixture_replication_v1.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from medscale.mesc._mrl_fixture_loop_v1 import (\n    FixtureLoopResult,\n"
          new_import = "from medscale.mesc._mrl_fixture_loop_v1 import (\n    FixtureExperimentProposal,\n    FixtureLoopResult,\n"
          old_signature = "def _admission(label: str, proposal) -> ResearchInputAdmissionContract:\n"
          new_signature = (
              "def _admission(\n"
              "    label: str, proposal: FixtureExperimentProposal\n"
              ") -> ResearchInputAdmissionContract:\n"
          )
          if text.count(old_import) != 1:
              raise SystemExit("expected exactly one fixture-loop import anchor")
          if text.count(old_signature) != 1:
              raise SystemExit("expected exactly one untyped admission helper")
          text = text.replace(old_import, new_import, 1).replace(old_signature, new_signature, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Apply exact Ruff formatting
        run: uv run ruff format tests/test_mesc_mrl_fixture_replication_v1.py

      - name: Qualify repair locally
        run: |
          uv run ruff check tests/test_mesc_mrl_fixture_replication_v1.py
          uv run ruff format --check tests/test_mesc_mrl_fixture_replication_v1.py
          uv run mypy

      - name: Commit repair only
        run: |
          git diff -- tests/test_mesc_mrl_fixture_replication_v1.py
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M tests/test_mesc_mrl_fixture_replication_v1.py$')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_mesc_mrl_fixture_replication_v1.py
          git commit -m "test(mrl): type fixture admission helper"
          echo "REPAIRED_COMMIT=$(git rev-parse HEAD)"

      - name: Publish isolated repair commit
        run: git push --force-with-lease origin HEAD:refs/heads/diag/mrl-0205-mypy-output
