name: Auth format diagnostic

on:
  push:
    branches:
      - diag/mesc-auth-format-218

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Format changed Python files
        run: |
          uv run ruff format src/medscale/mesc/_training_authorization_receipt_v1.py tests/test_mesc_training_authorization_receipt_v1.py
          git diff -- src/medscale/mesc/_training_authorization_receipt_v1.py tests/test_mesc_training_authorization_receipt_v1.py > format.patch
          test -s format.patch

      - name: Upload format patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auth-format-patch
          path: format.patch
          retention-days: 1
          if-no-files-found: error
