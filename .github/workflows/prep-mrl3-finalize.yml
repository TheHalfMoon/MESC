name: prep MRL-3 final integrity hardening

on:
  push:
    branches:
      - prep/mrl-3-final-hardening-3ba536

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: uv python install 3.11
      - run: uv sync --frozen
      - name: Apply final reconciliation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_function(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text()
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              target.write_text(text[:start] + replacement.rstrip() + "\n\n" + text[end + 1:])

          replace_function(
              "src/medscale/mesc/_mrl_hard_medical_non_regression_v1.py",
              "def _snapshot_sealed_report(\n",
              "\ndef _validate_report_against_objective(\n",
              '''def _snapshot_sealed_report(
              report: SealedEvaluationEvidenceReport,
          ) -> SealedEvaluationEvidenceReport:
              if type(report) is not SealedEvaluationEvidenceReport:
                  raise HardMedicalNonRegressionError(
                      "sealed report must be an exact SealedEvaluationEvidenceReport"
                  )
              try:
                  return report._validated_snapshot()
              except (AttributeError, TypeError, ValueError) as exc:
                  raise HardMedicalNonRegressionError(
                      "sealed evidence report failed semantic revalidation"
                  ) from exc''',
          )

          replace_function(
              "src/medscale/mesc/_mrl_pareto_comparison_v1.py",
              "def _snapshot_sealed_report(\n",
              "\ndef _hard_gate_relation(\n",
              '''def _snapshot_sealed_report(
              report: SealedEvaluationEvidenceReport,
          ) -> SealedEvaluationEvidenceReport:
              if type(report) is not SealedEvaluationEvidenceReport:
                  raise ParetoComparisonError(
                      "sealed report must be an exact SealedEvaluationEvidenceReport"
                  )
              try:
                  return report._validated_snapshot()
              except (AttributeError, TypeError, ValueError) as exc:
                  raise ParetoComparisonError(
                      "sealed evidence report failed canonical revalidation"
                  ) from exc''',
          )

          replication_path = Path("tests/test_mesc_mrl_replication_set_policy_v1.py")
          replication = replication_path.read_text()
          old = 'object.__setattr__(members[0], "artifact_sha256", "invalid")'
          new = 'object.__setattr__(replication_set.members[0], "artifact_sha256", "invalid")'
          if replication.count(old) != 1:
              raise SystemExit(f"expected one replication mutation target, found {replication.count(old)}")
          replication_path.write_text(replication.replace(old, new, 1))

          budget_path = Path("tests/test_mesc_mrl_adaptive_budget_exhaustion_v1.py")
          budget = budget_path.read_text()
          old_regex = 'match="exhausted adaptive capacities"'
          new_regex = 'match="at least one exhausted capacity"'
          if budget.count(old_regex) != 2:
              raise SystemExit(f"expected two exhaustion regexes, found {budget.count(old_regex)}")
          budget_path.write_text(budget.replace(old_regex, new_regex))

          hard_path = Path("tests/test_mesc_mrl_hard_medical_non_regression_v1.py")
          hard = hard_path.read_text()
          hard_case = '''

          def test_valid_sealed_report_identity_drift_fails_closed_before_hard_gate_evaluation() -> None:
              objective = _objective()
              sealed = _sealed_report(objective)
              object.__setattr__(sealed, "sealed_evidence_ref_sha256", "1" * 64)

              with pytest.raises(HardMedicalNonRegressionError, match="semantic revalidation"):
                  evaluate_hard_medical_non_regression(objective, sealed)
          '''
          if "test_valid_sealed_report_identity_drift_fails_closed_before_hard_gate_evaluation" not in hard:
              hard_path.write_text(hard.rstrip() + hard_case + "\n")

          pareto_path = Path("tests/test_mesc_mrl_pareto_comparison_v1.py")
          pareto = pareto_path.read_text()
          pareto_case = '''

          def test_valid_candidate_sealed_report_identity_drift_fails_closed_before_pareto() -> None:
              objective = _multi_objective()
              reference = _sealed_report(
                  objective,
                  candidate_marker="a",
                  cost="10",
                  safety="0.96",
                  subgroup_safety="0.94",
              )
              candidate = _sealed_report(
                  objective,
                  candidate_marker="b",
                  cost="9",
                  safety="0.97",
                  subgroup_safety="0.95",
              )
              object.__setattr__(candidate, "sealed_evidence_ref_sha256", "f" * 64)

              with pytest.raises(ParetoComparisonError, match="hard-gate revalidation"):
                  compare_pareto_evidence(objective, reference, candidate)
          '''
          if "test_valid_candidate_sealed_report_identity_drift_fails_closed_before_pareto" not in pareto:
              pareto_path.write_text(pareto.rstrip() + pareto_case + "\n")
          PY
      - name: Canonical format
        run: >-
          uv run ruff format
          src/medscale/mesc/_mrl_replication_set_policy_v1.py
          src/medscale/mesc/_mrl_sealed_evaluation_interface_v1.py
          src/medscale/mesc/_mrl_sealed_evaluation_evidence_v1.py
          src/medscale/mesc/_mrl_hard_medical_non_regression_v1.py
          src/medscale/mesc/_mrl_pareto_comparison_v1.py
          src/medscale/mesc/_mrl_adaptive_campaign_accounting_v1.py
          src/medscale/mesc/_mrl_adaptive_budget_exhaustion_v1.py
          tests/test_mesc_mrl_replication_set_policy_v1.py
          tests/test_mesc_mrl_sealed_evaluation_interface_v1.py
          tests/test_mesc_mrl_sealed_evaluation_evidence_v1.py
          tests/test_mesc_mrl_hard_medical_non_regression_v1.py
          tests/test_mesc_mrl_pareto_comparison_v1.py
          tests/test_mesc_mrl_adaptive_campaign_accounting_v1.py
          tests/test_mesc_mrl_adaptive_budget_exhaustion_v1.py
      - name: Ruff lint
        run: uv run ruff check .
      - name: Global format check
        run: uv run ruff format --check .
      - name: Strict mypy
        run: uv run mypy
      - name: Focused MRL-0303..0309 tests
        run: >-
          uv run pytest -q
          tests/test_mesc_mrl_replication_set_policy_v1.py
          tests/test_mesc_mrl_sealed_evaluation_interface_v1.py
          tests/test_mesc_mrl_sealed_evaluation_evidence_v1.py
          tests/test_mesc_mrl_hard_medical_non_regression_v1.py
          tests/test_mesc_mrl_pareto_comparison_v1.py
          tests/test_mesc_mrl_adaptive_campaign_accounting_v1.py
          tests/test_mesc_mrl_adaptive_budget_exhaustion_v1.py
      - name: Commit finalized prep blobs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_mrl_replication_set_policy_v1.py \
                  src/medscale/mesc/_mrl_sealed_evaluation_interface_v1.py \
                  src/medscale/mesc/_mrl_sealed_evaluation_evidence_v1.py \
                  src/medscale/mesc/_mrl_hard_medical_non_regression_v1.py \
                  src/medscale/mesc/_mrl_pareto_comparison_v1.py \
                  src/medscale/mesc/_mrl_adaptive_campaign_accounting_v1.py \
                  src/medscale/mesc/_mrl_adaptive_budget_exhaustion_v1.py \
                  tests/test_mesc_mrl_replication_set_policy_v1.py \
                  tests/test_mesc_mrl_sealed_evaluation_interface_v1.py \
                  tests/test_mesc_mrl_sealed_evaluation_evidence_v1.py \
                  tests/test_mesc_mrl_hard_medical_non_regression_v1.py \
                  tests/test_mesc_mrl_pareto_comparison_v1.py \
                  tests/test_mesc_mrl_adaptive_campaign_accounting_v1.py \
                  tests/test_mesc_mrl_adaptive_budget_exhaustion_v1.py
          git commit -m "fix(mrl): finalize MRL-3 integrity reconciliation"
          git push origin HEAD:prep/mrl-3-final-hardening-3ba536
