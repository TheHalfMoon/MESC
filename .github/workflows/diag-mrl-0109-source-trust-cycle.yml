name: DIAG MRL-0109 Source Trust And Cycle Repair

on:
  push:
    branches:
      - diag/mrl-0109-source-trust-cycle-b2c1940

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Apply bounded repair
        run: python .github/diag/mrl0109_source_trust_cycle.py
      - name: Canonical formatting
        run: >-
          uv run ruff format
          src/medscale/mesc/_mrl_research_input_admission_v1.py
          src/medscale/mesc/_mrl_research_input_permission_trust_v1.py
          tests/test_mesc_mrl_research_input_admission_v1.py
      - name: Ruff lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Canonical mypy
        run: uv run mypy src tests
      - name: Focused MRL-0109 tests
        run: uv run pytest -q tests/test_mesc_mrl_research_input_admission_v1.py
      - name: Full test suite
        run: uv run pytest -q
      - name: Integrity gate
        run: uv run medscale check
      - name: Verify bounded target diff
        shell: bash
        run: |
          git diff --check
          expected="$(printf '%s\n' \
            src/medscale/mesc/_mrl_research_input_admission_v1.py \
            src/medscale/mesc/_mrl_research_input_permission_trust_v1.py \
            tests/test_mesc_mrl_research_input_admission_v1.py | sort)"
          actual="$(git status --short | awk '{print $2}' | grep -v '^\.github/' | sort)"
          test "$actual" = "$expected"
      - name: Commit qualified target files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/medscale/mesc/_mrl_research_input_admission_v1.py \
            src/medscale/mesc/_mrl_research_input_permission_trust_v1.py \
            tests/test_mesc_mrl_research_input_admission_v1.py
          git commit -m "fix(diag): require trusted source permissions and fail closed on cycles"
          git push origin HEAD:diag/mrl-0109-source-trust-cycle-b2c1940
