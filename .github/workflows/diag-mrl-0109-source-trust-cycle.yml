name: DIAG MRL-0109 Source Trust And Cycle Repair

on:
  push:
    branches:
      - diag/mrl-0109-source-trust-cycle-b2c1940

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Apply bounded repair
        run: python .github/diag/mrl0109_source_trust_cycle.py
      - name: Correct permission identity model
        run: python .github/diag/mrl0109_source_trust_cycle_v2.py
      - name: Normalize target literals and test typing
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/medscale/mesc/_mrl_research_input_admission_v1.py")
          source = path.read_text()
          source = source.replace(
              '"learning-admitted input requires exact source artifact and contract identities"',
              '"learning-admitted input requires exact source artifact and "\n'
              '                    "contract identities"',
          )
          source = source.replace(
              '"rejected input cannot carry source artifact or contract identities into MRL"',
              '"rejected input cannot carry source artifact or contract "\n'
              '                    "identities into MRL"',
          )
          path.write_text(source)

          test_path = Path("tests/test_mesc_mrl_research_input_admission_v1.py")
          tests = test_path.read_text()
          tests = tests.replace(
              "from dataclasses import FrozenInstanceError, replace\n",
              "from collections.abc import Iterator\nfrom dataclasses import FrozenInstanceError, replace\n",
              1,
          )
          tests = tests.replace(
              "def _reset_source_permission_trust():\n",
              "def _reset_source_permission_trust() -> Iterator[None]:\n",
              1,
          )
          tests = tests.replace(
              'match="cannot carry source artifact"',
              'match="cannot carry a source permission"',
          )
          tests = tests.replace(
              'match="not trusted|governing source contract"',
              'match=r"not trusted|governing source contract"',
              1,
          )
          subclass_fixture = (
              "        source_contract_sha256=base.source_contract_sha256,\n"
              "        allowed_learning_surfaces=base.allowed_learning_surfaces,\n"
              "    )\n\n"
              "    with pytest.raises(ResearchInputAdmissionError, match=\"exact ResearchInputAdmissionContract\"):\n"
          )
          subclass_fixture_with_permission = (
              "        source_contract_sha256=base.source_contract_sha256,\n"
              "        allowed_learning_surfaces=base.allowed_learning_surfaces,\n"
              "        source_permission=base.source_permission,\n"
              "    )\n\n"
              "    with pytest.raises(ResearchInputAdmissionError, match=\"exact ResearchInputAdmissionContract\"):\n"
          )
          if subclass_fixture not in tests:
              raise SystemExit("subclass compatibility fixture marker missing")
          tests = tests.replace(
              subclass_fixture,
              subclass_fixture_with_permission,
              1,
          )
          test_path.write_text(tests)
      - name: Canonical formatting
        run: >-
          uv run ruff format
          src/medscale/mesc/_mrl_research_input_admission_v1.py
          src/medscale/mesc/_mrl_research_input_permission_trust_v1.py
          tests/test_mesc_mrl_research_input_admission_v1.py
      - name: Ruff lint and format check
        id: ruff
        shell: bash
        run: |
          set +e
          {
            uv run ruff check src tests
            lint_rc=$?
            uv run ruff format --check src tests
            format_rc=$?
            exit_rc=$lint_rc
            if [ "$exit_rc" -eq 0 ]; then exit_rc=$format_rc; fi
            echo "lint_rc=$lint_rc"
            echo "format_rc=$format_rc"
            exit "$exit_rc"
          } > .github/diag/ruff-mrl0109.log 2>&1
          rc=$?
          cat .github/diag/ruff-mrl0109.log
          exit "$rc"
      - name: Upload Ruff diagnostics
        if: failure() && steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mrl0109-ruff-failure-${{ github.run_number }}
          path: .github/diag/ruff-mrl0109.log
          retention-days: 1
      - name: Canonical mypy
        run: uv run mypy src tests
      - name: Focused MRL-0109 tests
        id: focused
        shell: bash
        run: |
          set +e
          uv run pytest -q tests/test_mesc_mrl_research_input_admission_v1.py > .github/diag/focused-mrl0109.log 2>&1
          rc=$?
          cat .github/diag/focused-mrl0109.log
          exit "$rc"
      - name: Upload focused diagnostics
        if: failure() && steps.focused.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mrl0109-focused-failure-${{ github.run_number }}
          path: .github/diag/focused-mrl0109.log
          retention-days: 1
      - name: Full test suite
        run: uv run pytest -q
      - name: Integrity gate
        run: uv run medscale check
      - name: Verify bounded target diff
        shell: bash
        run: |
          git diff --check
          expected="$(printf '%s\n' \
            src/medscale/mesc/_mrl_research_input_admission_v1.py \
            src/medscale/mesc/_mrl_research_input_permission_trust_v1.py \
            tests/test_mesc_mrl_research_input_admission_v1.py | sort)"
          actual="$(git status --short | awk '{print $2}' | grep -v '^\.github/' | sort)"
          test "$actual" = "$expected"
      - name: Commit qualified target files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/medscale/mesc/_mrl_research_input_admission_v1.py \
            src/medscale/mesc/_mrl_research_input_permission_trust_v1.py \
            tests/test_mesc_mrl_research_input_admission_v1.py
          git commit -m "fix(diag): require trusted source permissions and fail closed on cycles"
          git push origin HEAD:diag/mrl-0109-source-trust-cycle-b2c1940
