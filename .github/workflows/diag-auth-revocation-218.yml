name: Auth revocation diagnostic

on:
  push:
    branches:
      - diag/mesc-auth-revocation-218

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Apply use-time trust repair
        run: |
          uv run python scripts/diag_auth_revocation_218.py
          uv run python scripts/diag_auth_revocation_tests_218.py
      - name: Ruff candidate and repository
        run: |
          uv run ruff check --fix \
            src/medscale/mesc/_training_authorization_receipt_v1.py \
            src/medscale/mesc/_training_readiness_v1.py \
            src/medscale/mesc/_training_readiness_receipt_binding_v1.py \
            tests/_training_authorization_test_support.py \
            tests/conftest.py \
            tests/test_mesc_training_authorization_receipt_v1.py \
            tests/test_mesc_training_readiness_receipt_binding_v1.py \
            tests/test_mesc_training_readiness_v1.py \
            tests/test_mesc_training_launch_plan_v1.py \
            tests/test_mesc_training_executor_v1.py \
            tests/test_mesc_training_orchestrator_v1.py
          uv run ruff format \
            src/medscale/mesc/_training_authorization_receipt_v1.py \
            src/medscale/mesc/_training_readiness_v1.py \
            src/medscale/mesc/_training_readiness_receipt_binding_v1.py \
            tests/_training_authorization_test_support.py \
            tests/conftest.py \
            tests/test_mesc_training_authorization_receipt_v1.py \
            tests/test_mesc_training_readiness_receipt_binding_v1.py \
            tests/test_mesc_training_readiness_v1.py \
            tests/test_mesc_training_launch_plan_v1.py \
            tests/test_mesc_training_executor_v1.py \
            tests/test_mesc_training_orchestrator_v1.py
          uv run ruff check . \
            --exclude scripts/diag_auth_revocation_218.py \
            --exclude scripts/diag_auth_revocation_tests_218.py
          uv run ruff format --check . \
            --exclude scripts/diag_auth_revocation_218.py \
            --exclude scripts/diag_auth_revocation_tests_218.py
      - name: Mypy strict
        run: uv run mypy src tests scripts --exclude '^scripts/diag_auth_revocation(_tests)?_218\.py$'
      - name: Targeted revocation qualification
        run: |
          uv run pytest -q \
            tests/test_mesc_training_authorization_receipt_v1.py \
            tests/test_mesc_training_readiness_receipt_binding_v1.py \
            tests/test_mesc_training_readiness_v1.py \
            tests/test_mesc_training_launch_plan_v1.py \
            tests/test_mesc_training_executor_v1.py \
            tests/test_mesc_training_orchestrator_v1.py
      - name: Full pytest
        run: uv run pytest --cov --cov-report=term-missing
      - name: MedScale integrity
        run: uv run medscale check
      - name: Diff check
        run: git diff --check
      - name: Commit validated candidate bytes
        run: |
          set -euo pipefail
          git config user.name "MESC diagnostic bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            specs/mesc-training-authorization-receipt-v1/README.md \
            src/medscale/mesc/_training_authorization_receipt_v1.py \
            src/medscale/mesc/_training_readiness_v1.py \
            src/medscale/mesc/_training_readiness_receipt_binding_v1.py \
            tests/_training_authorization_test_support.py \
            tests/conftest.py \
            tests/test_mesc_training_authorization_receipt_v1.py \
            tests/test_mesc_training_readiness_receipt_binding_v1.py \
            tests/test_mesc_training_readiness_v1.py \
            tests/test_mesc_training_launch_plan_v1.py \
            tests/test_mesc_training_executor_v1.py \
            tests/test_mesc_training_orchestrator_v1.py
          git diff --cached --check
          git commit -m "fix(mesc): revalidate authorization trust at use time [skip ci]"
          git push origin HEAD:diag/mesc-auth-revocation-218
