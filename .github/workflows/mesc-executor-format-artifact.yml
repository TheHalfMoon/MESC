name: MESC Executor Qodo Repair Commit

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact executor branch
        uses: actions/checkout@v4
        with:
          ref: feat/mesc-training-executor-v1
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Repair exact-head canonical input and path validation
        shell: bash
        run: |
          set -euo pipefail
          expected_head="f009e5f75ad04698ee047f13885719214b81675e"
          test "$(git rev-parse HEAD)" = "$expected_head"
          uv sync --frozen

          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/medscale/mesc/_training_executor_v1.py")
          source = source_path.read_text(encoding="utf-8")

          source = source.replace(
              "from copy import deepcopy\nfrom dataclasses import dataclass\n",
              "from dataclasses import dataclass, replace\n",
              1,
          )
          source = source.replace(
              "from medscale.mesc._training_readiness_v1 import (\n"
              "    TrainingReadinessManifest,\n",
              "from medscale.mesc._training_readiness_v1 import (\n"
              "    TrainingCandidate,\n"
              "    TrainingReadinessManifest,\n",
              1,
          )
          source = source.replace(
              "from medscale.modelkit.manifests import RunnerClass\n",
              "from medscale.modelkit.interfaces import ModelRef\n"
              "from medscale.modelkit.manifests import RunnerClass\n"
              "from medscale.modelkit.recipes import AdapterMethod, DatasetRef, TrainingRecipe\n",
              1,
          )

          old_snapshot = '''    try:\n        manifest = deepcopy(manifest)\n        readiness = deepcopy(readiness)\n        launch_plan = deepcopy(launch_plan)\n        corpus_binding = deepcopy(corpus_binding)\n        local_assets = deepcopy(local_assets)\n        environment = deepcopy(environment)\n    except Exception as exc:\n        raise TrainingExecutionError("canonical execution inputs could not be snapshotted") from exc\n\n'''
          new_snapshot = '''    (\n        manifest,\n        readiness,\n        launch_plan,\n        corpus_binding,\n        local_assets,\n        environment,\n    ) = _snapshot_execution_inputs(\n        manifest=manifest,\n        readiness=readiness,\n        launch_plan=launch_plan,\n        corpus_binding=corpus_binding,\n        local_assets=local_assets,\n        environment=environment,\n    )\n\n'''
          if old_snapshot not in source:
              raise SystemExit("snapshot block anchor missing")
          source = source.replace(old_snapshot, new_snapshot, 1)

          helper_anchor = '''def _recompute_launch(\n    *,\n    manifest: TrainingReadinessManifest,\n'''
          if helper_anchor not in source:
              raise SystemExit("recompute helper anchor missing")
          helper_code = '''def _snapshot_execution_inputs(\n    *,\n    manifest: TrainingReadinessManifest,\n    readiness: TrainingReadinessReport,\n    launch_plan: TrainingLaunchPlan,\n    corpus_binding: TrainingCorpusBindingReport,\n    local_assets: TrainingLocalAssetAttestationReport,\n    environment: TrainingExecutionEnvironment,\n) -> tuple[\n    TrainingReadinessManifest,\n    TrainingReadinessReport,\n    TrainingLaunchPlan,\n    TrainingCorpusBindingReport,\n    TrainingLocalAssetAttestationReport,\n    TrainingExecutionEnvironment,\n]:\n    _require_nested_canonical_types(manifest=manifest, launch_plan=launch_plan)\n    try:\n        compact_recipe = replace(\n            manifest.compact_recipe,\n            base=replace(manifest.compact_recipe.base),\n            dataset=replace(manifest.compact_recipe.dataset),\n        )\n        reasoner_recipe = replace(\n            manifest.reasoner_recipe,\n            base=replace(manifest.reasoner_recipe.base),\n            dataset=replace(manifest.reasoner_recipe.dataset),\n        )\n        manifest_snapshot = replace(\n            manifest,\n            compact_candidate=replace(manifest.compact_candidate),\n            reasoner_candidate=replace(manifest.reasoner_candidate),\n            compact_recipe=compact_recipe,\n            reasoner_recipe=reasoner_recipe,\n        )\n        launch_snapshot = replace(\n            launch_plan,\n            compact=replace(launch_plan.compact),\n            reasoner=replace(launch_plan.reasoner),\n        )\n        return (\n            manifest_snapshot,\n            replace(readiness),\n            launch_snapshot,\n            replace(corpus_binding),\n            replace(local_assets),\n            replace(environment),\n        )\n    except Exception as exc:\n        raise TrainingExecutionError(\n            "canonical execution inputs could not be reconstructed"\n        ) from exc\n\n\ndef _require_nested_canonical_types(\n    *,\n    manifest: TrainingReadinessManifest,\n    launch_plan: TrainingLaunchPlan,\n) -> None:\n    checks: tuple[tuple[str, object, type[object]], ...] = (\n        ("manifest.compact_candidate", manifest.compact_candidate, TrainingCandidate),\n        ("manifest.reasoner_candidate", manifest.reasoner_candidate, TrainingCandidate),\n        ("manifest.compact_recipe", manifest.compact_recipe, TrainingRecipe),\n        ("manifest.reasoner_recipe", manifest.reasoner_recipe, TrainingRecipe),\n        ("launch_plan.compact", launch_plan.compact, TrainingRunPlan),\n        ("launch_plan.reasoner", launch_plan.reasoner, TrainingRunPlan),\n    )\n    for field, value, expected_type in checks:\n        _require_exact_input(value, expected_type, field=field)\n\n    for field, recipe in (\n        ("manifest.compact_recipe", manifest.compact_recipe),\n        ("manifest.reasoner_recipe", manifest.reasoner_recipe),\n    ):\n        _require_exact_input(recipe.base, ModelRef, field=f"{field}.base")\n        _require_exact_input(recipe.dataset, DatasetRef, field=f"{field}.dataset")\n        _require_exact_input(recipe.method, AdapterMethod, field=f"{field}.method")\n\n\n'''
          source = source.replace(helper_anchor, helper_code + helper_anchor, 1)

          path_anchor = '''    if not isinstance(value, str) or not value or "\\\\" in value:\n        raise TrainingExecutionError(f"{field} must be a non-empty POSIX repository path")\n'''
          path_replacement = '''    if (\n        not isinstance(value, str)\n        or not value\n        or "\\\\" in value\n        or "\\x00" in value\n    ):\n        raise TrainingExecutionError(f"{field} must be a non-empty POSIX repository path")\n'''
          if path_anchor not in source:
              raise SystemExit("path validator anchor missing")
          source = source.replace(path_anchor, path_replacement, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_mesc_training_executor_v1.py")
          tests = test_path.read_text(encoding="utf-8")
          sentinel = "def test_forged_nested_run_plan_is_rejected_before_backend() -> None:"
          if sentinel in tests:
              raise SystemExit("Qodo repair tests already appended")
          tests += '''\n\n\ndef test_forged_nested_run_plan_is_rejected_before_backend() -> None:\n    manifest, readiness, launch, binding, assets, environment = _bundle()\n    backend = _SuccessBackend()\n\n    class ForgedRunPlan(TrainingRunPlan):\n        pass\n\n    forged = object.__new__(ForgedRunPlan)\n    for field_name in TrainingRunPlan.__dataclass_fields__:\n        object.__setattr__(forged, field_name, getattr(launch.compact, field_name))\n    forged_launch = replace(launch, compact=forged)\n\n    with pytest.raises(TrainingExecutionError, match="launch_plan.compact"):\n        execute_training(\n            manifest=manifest,\n            readiness=readiness,\n            launch_plan=forged_launch,\n            corpus_binding=binding,\n            local_assets=assets,\n            environment=environment,\n            role="compact",\n            backend=backend,\n        )\n    assert backend.manifest is None\n\n\ndef test_mutated_exact_run_plan_is_revalidated_before_backend() -> None:\n    manifest, readiness, launch, binding, assets, environment = _bundle()\n    backend = _SuccessBackend()\n    object.__setattr__(launch.compact, "result_paths", ("../escape",))\n\n    with pytest.raises(\n        TrainingExecutionError,\n        match="canonical execution inputs could not be reconstructed",\n    ):\n        execute_training(\n            manifest=manifest,\n            readiness=readiness,\n            launch_plan=launch,\n            corpus_binding=binding,\n            local_assets=assets,\n            environment=environment,\n            role="compact",\n            backend=backend,\n        )\n    assert backend.manifest is None\n\n\ndef test_result_artifact_path_rejects_nul() -> None:\n    with pytest.raises(TrainingExecutionError, match="POSIX repository path"):\n        TrainingResultArtifact(\n            path="experiments/compact/result\\x00.json",\n            sha256="1" * 64,\n            byte_count=1,\n        )\n'''
          test_path.write_text(tests, encoding="utf-8")
          PY

          uv run ruff check --fix \
            src/medscale/mesc/_training_executor_v1.py \
            tests/test_mesc_training_executor_v1.py
          uv run ruff format \
            src/medscale/mesc/_training_executor_v1.py \
            tests/test_mesc_training_executor_v1.py
          uv run ruff check \
            src/medscale/mesc/_training_executor_v1.py \
            tests/test_mesc_training_executor_v1.py
          uv run ruff format --check \
            src/medscale/mesc/_training_executor_v1.py \
            tests/test_mesc_training_executor_v1.py
          uv run mypy
          uv run pytest tests/test_mesc_training_executor_v1.py -q
          git diff --check

          changed_count="$(git diff --name-only | wc -l | tr -d ' ')"
          test "$changed_count" = "2"
          git diff --name-only | grep -Fx 'src/medscale/mesc/_training_executor_v1.py'
          git diff --name-only | grep -Fx 'tests/test_mesc_training_executor_v1.py'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/medscale/mesc/_training_executor_v1.py \
            tests/test_mesc_training_executor_v1.py
          git commit -m 'fix(mesc): harden canonical executor inputs and paths'
          git push origin HEAD:feat/mesc-training-executor-v1
