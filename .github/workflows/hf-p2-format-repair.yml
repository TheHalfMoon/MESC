name: P2 Format Repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hf-p2-format-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    name: format exact P2 candidate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
          persist-credentials: true
      - name: Bind repair bootstrap to exact predecessor
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "cbc63ffb1d5162f2b798d0cfb8124b21b03aad4c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/hf-p2-format-repair.yml"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Apply exact Ruff formatter
        shell: bash
        run: |
          uv sync --frozen
          uv run ruff format             src/medscale/mesc/_hf_publication_v2.py             tests/test_mesc_hf_publication_v2.py
      - name: Qualify formatted candidate
        shell: bash
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q tests/test_mesc_hf_publication_v1.py tests/test_mesc_hf_publication_v2.py
          git diff --check
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medscale/mesc/_hf_publication_v2.py tests/test_mesc_hf_publication_v2.py
          git rm .github/workflows/hf-p2-format-repair.yml
          git diff --cached --check
          git commit -m "style: format P2 publication transport"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
