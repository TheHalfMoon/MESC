name: Diagnostic PR 217 Canonical Receipt Repair

on:
  push:
    branches:
      - diag/pr217-canonical-receipt-repair

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mesc-release-semantic-evidence-v1
          persist-credentials: true
          fetch-depth: 0

      - name: Assert exact target head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "44f5f684b003d9e554d61a024d24b9b2cf308dd0"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync locked default environment
        run: uv sync --frozen

      - name: Apply canonical receipt reconstruction repair
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          source = Path("src/medscale/mesc/_release_semantic_evidence_v1.py")
          text = source.read_text(encoding="utf-8")

          old_import = (
              "from medscale.mesc._canonical_json_v1 import canonical_json_bytes\n"
              "from medscale.reproducibility import content_hash\n"
          )
          new_import = (
              "from medscale.mesc._canonical_json_v1 import canonical_json_bytes\n"
              "from medscale.mesc._training_executor_v1 import (\n"
              "    TrainingExecutionDisposition,\n"
              "    TrainingExecutionError,\n"
              "    TrainingExecutionReceipt,\n"
              "    TrainingResultArtifact,\n"
              ")\n"
              "from medscale.mesc._training_launch_plan_v1 import TrainingRole\n"
              "from medscale.reproducibility import content_hash\n"
          )
          if old_import not in text:
              raise SystemExit("import anchor missing")
          text = text.replace(old_import, new_import, 1)

          class_anchor = text.index("class TrainingExecutionEvidence:")
          start = text.index(
              '        if payload["executor_version"] != _EXECUTOR_VERSION:\n',
              class_anchor,
          )
          end_marker = '        object.__setattr__(self, "result_manifest_sha256", result_manifest)\n'
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''        receipt = _rebuild_training_receipt(payload)
          if receipt.disposition != "SUCCEEDED":
              raise ReleaseSemanticEvidenceError(
                  "training receipt disposition must be SUCCEEDED"
              )
          if receipt.to_dict() != payload:
              raise ReleaseSemanticEvidenceError(
                  "training receipt payload does not reproduce the canonical receipt"
              )
          if receipt.result_manifest_sha256 is None:
              raise ReleaseSemanticEvidenceError(
                  "successful training receipt requires result_manifest_sha256"
              )

          object.__setattr__(self, "receipt_sha256", receipt.receipt_sha256)
          object.__setattr__(
              self,
              "result_manifest_sha256",
              receipt.result_manifest_sha256,
          )
'''
          text = text[:start] + replacement + text[end:]

          insert_anchor = "\n\n@dataclass(frozen=True, slots=True)\nclass ReleaseBoundEvidenceDocument:"
          if insert_anchor not in text:
              raise SystemExit("release document anchor missing")
          helper = '''


def _rebuild_training_receipt(payload: dict[str, object]) -> TrainingExecutionReceipt:
    raw_artifacts = payload.get("result_artifacts")
    if type(raw_artifacts) is not list:
        raise ReleaseSemanticEvidenceError(
            "training receipt result_artifacts must be an exact list"
        )

    artifacts: list[TrainingResultArtifact] = []
    for raw_item in raw_artifacts:
        if type(raw_item) is not dict:
            raise ReleaseSemanticEvidenceError(
                "training receipt result artifact must be an exact object"
            )
        item = cast(dict[str, object], raw_item)
        if frozenset(item) != {"byte_count", "path", "sha256"}:
            raise ReleaseSemanticEvidenceError(
                "training receipt result artifact keys are invalid"
            )
        try:
            artifacts.append(
                TrainingResultArtifact(
                    path=cast(str, item["path"]),
                    sha256=cast(str, item["sha256"]),
                    byte_count=cast(int, item["byte_count"]),
                )
            )
        except (KeyError, TypeError, TrainingExecutionError) as exc:
            raise ReleaseSemanticEvidenceError(
                "training receipt result artifact is not canonical"
            ) from exc

    try:
        return TrainingExecutionReceipt(
            disposition=cast(TrainingExecutionDisposition, payload["disposition"]),
            launch_plan_sha256=cast(str, payload["launch_plan_sha256"]),
            run_plan_sha256=cast(str, payload["run_plan_sha256"]),
            readiness_manifest_sha256=cast(str, payload["readiness_manifest_sha256"]),
            corpus_binding_sha256=cast(str, payload["corpus_binding_sha256"]),
            local_asset_attestation_sha256=cast(
                str,
                payload["local_asset_attestation_sha256"],
            ),
            execution_manifest_sha256=cast(str, payload["execution_manifest_sha256"]),
            environment_sha256=cast(str, payload["environment_sha256"]),
            role=cast(TrainingRole, payload["role"]),
            experiment_id=cast(str, payload["experiment_id"]),
            model_id=cast(str, payload["model_id"]),
            revision=cast(str, payload["revision"]),
            weights_sha256=cast(str, payload["weights_sha256"]),
            training_dataset_sha256=cast(str, payload["training_dataset_sha256"]),
            repository_sha=cast(str, payload["repository_sha"]),
            repository_tree=cast(str, payload["repository_tree"]),
            dependency_lock_sha256=cast(str, payload["dependency_lock_sha256"]),
            runtime_qualification_sha256=cast(
                str,
                payload["runtime_qualification_sha256"],
            ),
            training_authorization_receipt_sha256=cast(
                str,
                payload["training_authorization_receipt_sha256"],
            ),
            backend_id=cast(str, payload["backend_id"]),
            backend_version=cast(str, payload["backend_version"]),
            started_at=cast(str, payload["started_at"]),
            finished_at=cast(str, payload["finished_at"]),
            result_artifacts=tuple(artifacts),
            result_manifest_sha256=cast(str | None, payload["result_manifest_sha256"]),
            failure_reason=cast(str | None, payload["failure_reason"]),
            executor_version=cast(str, payload["executor_version"]),
        )
    except (KeyError, TypeError, TrainingExecutionError) as exc:
        raise ReleaseSemanticEvidenceError(
            "training receipt does not satisfy canonical executor invariants"
        ) from exc
'''
          text = text.replace(insert_anchor, helper + insert_anchor, 1)
          source.write_text(text, encoding="utf-8")

          tests = Path("tests/test_mesc_release_semantic_evidence_v1.py")
          test_text = tests.read_text(encoding="utf-8")
          addition = '''


def test_training_receipt_rejects_invalid_timestamp() -> None:
    payload = _training_payload()
    payload["started_at"] = "not-a-timestamp"

    with pytest.raises(ReleaseSemanticEvidenceError, match="canonical executor invariants"):
        TrainingExecutionEvidence(canonical_json_bytes(payload))


def test_training_receipt_rejects_noncanonical_artifact_path() -> None:
    payload = _training_payload()
    artifacts = payload["result_artifacts"]
    assert isinstance(artifacts, list)
    first = artifacts[0]
    assert isinstance(first, dict)
    first["path"] = "../escape.safetensors"

    with pytest.raises(ReleaseSemanticEvidenceError, match="canonical"):
        TrainingExecutionEvidence(canonical_json_bytes(payload))
'''
          if "test_training_receipt_rejects_invalid_timestamp" in test_text:
              raise SystemExit("regressions already present")
          tests.write_text(test_text + addition, encoding="utf-8")
          PY

      - name: Format and enforce mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            src/medscale/mesc/_release_semantic_evidence_v1.py \
            tests/test_mesc_release_semantic_evidence_v1.py
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            case "$path" in
              src/medscale/mesc/_release_semantic_evidence_v1.py|tests/test_mesc_release_semantic_evidence_v1.py) ;;
              *) echo "unexpected mutation: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Qualify repair
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src/medscale/mesc/_release_artifact_qualification_v1.py src/medscale/mesc/_release_semantic_evidence_v1.py
          uv run pytest -q tests/test_mesc_release_artifact_qualification_v1.py tests/test_mesc_release_semantic_evidence_v1.py
          uv lock --check

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add \
            src/medscale/mesc/_release_semantic_evidence_v1.py \
            tests/test_mesc_release_semantic_evidence_v1.py
          git commit -m "fix(mesc): reconstruct canonical training receipts"
          git push origin HEAD:fix/mesc-release-semantic-evidence-v1
