name: MRL-0104 ledger closeout once

on:
  push:
    branches:
      - tmp/mrl-0104-ledger-closeout

permissions:
  contents: write

jobs:
  closeout-ledger:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/mrl-0104-ledger-closeout
          fetch-depth: 0
          persist-credentials: true

      - name: Mark only MRL-0104 closeout candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("specs/mesc-research-loop-v1/tasks.md")
          text = path.read_text()
          old = '- [ ] **MRL-0104 — Bind existing `ExperimentManifest`**'
          new = '- [x] **MRL-0104 — Bind existing `ExperimentManifest`**'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one unchecked MRL-0104 ledger entry")
          if text.count(new) != 0:
              raise SystemExit("MRL-0104 already checked unexpectedly")
          path.write_text(text.replace(old, new))
          PY

      - name: Verify exact one-line ledger delta
        shell: bash
        run: |
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "specs/mesc-research-loop-v1/tasks.md"
          test "$(git diff --numstat -- specs/mesc-research-loop-v1/tasks.md)" = $'1\t1\tspecs/mesc-research-loop-v1/tasks.md'
          git diff --check
          git diff -- specs/mesc-research-loop-v1/tasks.md

      - name: Commit ledger blob
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/mesc-research-loop-v1/tasks.md
          git commit -m "docs(mrl): mark MRL-0104 closeout candidate [skip ci]"
          git push origin HEAD:tmp/mrl-0104-ledger-closeout
