name: Diagnostic PR 217 Strict JSON Review Repair

on:
  push:
    branches:
      - diag/pr217-full-mypy-fixture-repair

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mesc-release-semantic-evidence-v1
          persist-credentials: true
          fetch-depth: 0

      - name: Assert exact target head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "df7ea93afcd37f2333192475b725bf38d4ade173"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync locked default environment
        run: uv sync --frozen

      - name: Repair strict JSON parsing and domain errors
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/repair_pr217.py
          uv run python /tmp/repair_pr217.py

      - name: Format and enforce mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            src/medscale/mesc/_release_semantic_evidence_v1.py \
            tests/test_mesc_release_semantic_evidence_v1.py
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "src/medscale/mesc/_release_semantic_evidence_v1.py"
          test "${changed[1]}" = "tests/test_mesc_release_semantic_evidence_v1.py"

      - name: Qualify review repair
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q tests/test_mesc_release_artifact_qualification_v1.py tests/test_mesc_release_semantic_evidence_v1.py
          uv lock --check

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add \
            src/medscale/mesc/_release_semantic_evidence_v1.py \
            tests/test_mesc_release_semantic_evidence_v1.py
          git commit -m "fix(mesc): reject malformed release evidence JSON"
          git push origin HEAD:fix/mesc-release-semantic-evidence-v1
