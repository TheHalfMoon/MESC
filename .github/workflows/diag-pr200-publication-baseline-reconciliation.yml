name: Diagnostic PR 200 publication baseline reconciliation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: diag-pr200-publication-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Validate repair before target push
        run: |
          set -euo pipefail
          cp scripts/_diag_pr200_publication_baseline_reconciliation.py /tmp/reconcile.py
          git fetch origin feat/mesc-hf-sft-dependency-lock-v1
          test "$(git rev-parse origin/feat/mesc-hf-sft-dependency-lock-v1)" = \
            "858d04d824dda1e83f112ec789b818b82d9a0f94"
          git switch --detach 858d04d824dda1e83f112ec789b818b82d9a0f94
          python /tmp/reconcile.py
          uv sync --frozen
          uv run ruff format \
            tests/test_mesc_p01_04b_publication_qualification_v1.py
          uv run ruff check \
            tests/test_mesc_p01_04b_publication_qualification_v1.py \
            tests/test_mesc_hf_sft_dependency_lock_v1.py
          uv run ruff format --check \
            tests/test_mesc_p01_04b_publication_qualification_v1.py \
            tests/test_mesc_hf_sft_dependency_lock_v1.py
          uv run mypy \
            tests/test_mesc_p01_04b_publication_qualification_v1.py \
            tests/test_mesc_hf_sft_dependency_lock_v1.py
          uv run pytest \
            tests/test_mesc_fixture_publication_v1.py \
            tests/test_mesc_p01_04b_publication_qualification_v1.py \
            tests/test_mesc_hf_sft_dependency_lock_v1.py
          uv lock --check
          git diff --check
          changed="$(git diff --name-only)"
          expected="$(printf '%s\n%s' \
            'specs/mesc-hf-sft-dependency-lock-v1/README.md' \
            'tests/test_mesc_p01_04b_publication_qualification_v1.py')"
          test "$changed" = "$expected"
          git add \
            specs/mesc-hf-sft-dependency-lock-v1/README.md \
            tests/test_mesc_p01_04b_publication_qualification_v1.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(mesc): preserve historical publication dependency baseline"
          git push origin HEAD:refs/heads/feat/mesc-hf-sft-dependency-lock-v1
