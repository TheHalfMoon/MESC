name: MESC Experiment-0 temporary fixture repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mesc-exp0-fixture-fix-temp.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 374 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: uv python install 3.11
      - run: uv sync --frozen
      - name: Repair shared verifier fixtures and add direct lane-binding regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          fixture = Path("tests/test_verify_mesc_experiment_0_evidence.py")
          text = fixture.read_text()
          old = '        "dataset_identities": [{"dataset_id": "dataset-test"}],\n        "evaluator_identities": [{"evaluator_id": "evaluator-test"}],\n'
          new = '        "dataset_identities": [\n            {\n                "dataset_id": "dataset-test",\n                "split_id": "split-test",\n                "held_out_tier": "tier-test",\n            }\n        ],\n        "evaluator_identities": [{"evaluator_id": "evaluator-test"}],\n        "scoring_policy_identities": [{"scoring_policy_id": "scoring-test"}],\n'
          if old not in text:
              raise SystemExit("fixture identity anchor not found")
          fixture.write_text(text.replace(old, new, 1))

          integrity = Path("tests/test_verify_mesc_experiment_0_evidence_integrity.py")
          text = integrity.read_text()
          old = '        "lane": "smoke",\n        "metric_vector": {},\n'
          new = '        "lane": "smoke",\n        "dataset_id": "dataset-test",\n        "split_id": "split-test",\n        "held_out_tier": "tier-test",\n        "evaluator_id": "evaluator-test",\n        "scoring_policy_id": "scoring-test",\n        "prompt_template_id": "prompt-test",\n        "generation_config_id": "generation-test",\n        "metric_vector": {},\n'
          if old not in text:
              raise SystemExit("result lane anchor not found")
          text = text.replace(old, new, 1)
          append = r'''


def _synthetic_bound_result(docs: dict[str, bytes]) -> tuple[str, dict[str, Any]]:
    """Build one result bound to every frozen evaluation identity."""
    config = json.loads(docs[f"{ROOT}/experiment-config.json"])
    candidate = config["candidate_roster"][0]
    runtime_bytes = docs[f"{ROOT}/runtime-receipt.json"]
    snapshot_path = f"{ROOT}/candidate-snapshots/{candidate['evidence_key']}.json"
    snapshot_bytes = docs[snapshot_path]
    result = {
        "schema_version": "MESC-EXPERIMENT-0-CANDIDATE-RESULT-V1",
        "experiment_config_sha256": hashlib.sha256(
            docs[f"{ROOT}/experiment-config.json"]
        ).hexdigest(),
        "runtime_receipt_sha256": hashlib.sha256(runtime_bytes).hexdigest(),
        "candidate_snapshot_receipt_sha256": hashlib.sha256(snapshot_bytes).hexdigest(),
        "candidate_id": candidate["candidate_id"],
        "candidate_revision": candidate["candidate_revision"],
        "evidence_key": candidate["evidence_key"],
        "lane": "smoke",
        "dataset_id": "dataset-test",
        "split_id": "split-test",
        "held_out_tier": "tier-test",
        "evaluator_id": "evaluator-test",
        "scoring_policy_id": "scoring-test",
        "prompt_template_id": "prompt-test",
        "generation_config_id": "generation-test",
        "metric_vector": {},
        "hard_floor_vector": {},
        "item_count": 0,
        "invalid_item_count": 0,
        "abstention_count": 0,
        "resource_usage": {},
        "query_budget_used": {},
        "result_exposure_used": {},
        "result_manifest_sha256": "4" * 64,
        "candidate_disposition": "BLOCKED_RUNTIME",
        "limitations": ["Synthetic lane-binding fixture."],
    }
    path = f"{ROOT}/lane-results/{candidate['evidence_key']}/smoke.json"
    return path, result


def test_verify_rejects_missing_result_lane_binding(tmp_path: Path) -> None:
    """Every result must contain all frozen evaluation-lane identities."""
    docs = FIXTURES._base_docs()
    path, result = _synthetic_bound_result(docs)
    result.pop("scoring_policy_id")
    docs[path] = FIXTURES._json_bytes(result)
    bundle = tmp_path / "missing-lane-binding.zip"
    FIXTURES._write_bundle(bundle, docs)
    with pytest.raises(VERIFIER.EvidenceError, match="field mismatch"):
        VERIFIER.verify(str(bundle))


def test_verify_rejects_mismatched_result_lane_binding(tmp_path: Path) -> None:
    """A result cannot name an evaluation identity outside the frozen config."""
    docs = FIXTURES._base_docs()
    path, result = _synthetic_bound_result(docs)
    result["evaluator_id"] = "unfrozen-evaluator"
    docs[path] = FIXTURES._json_bytes(result)
    bundle = tmp_path / "mismatched-lane-binding.zip"
    FIXTURES._write_bundle(bundle, docs)
    with pytest.raises(VERIFIER.EvidenceError, match="evaluator binding is not frozen"):
        VERIFIER.verify(str(bundle))
'''
          if "def _synthetic_bound_result" in text:
              raise SystemExit("lane-binding regression helpers already present")
          integrity.write_text(text.rstrip() + append + "\n")
          PY
          uv run ruff format tests/test_verify_mesc_experiment_0_evidence.py tests/test_verify_mesc_experiment_0_evidence_integrity.py
          uv run ruff check tests/test_verify_mesc_experiment_0_evidence.py tests/test_verify_mesc_experiment_0_evidence_integrity.py
          uv run pytest -q tests/test_verify_mesc_experiment_0_evidence.py tests/test_verify_mesc_experiment_0_evidence_integrity.py
          git rm .github/workflows/mesc-exp0-fixture-fix-temp.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_verify_mesc_experiment_0_evidence.py tests/test_verify_mesc_experiment_0_evidence_integrity.py
          git commit -m "test(mesc): bind Experiment-0 fixtures to frozen evaluation identities"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
