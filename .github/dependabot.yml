version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    # MRL-0809 runtime-feasibility versions are exact, governance-bound evidence.
    # Any version change to this frozen runtime surface must use a separately
    # reviewed governed PR with regenerated lock/static bindings and qualification.
    ignore:
      - dependency-name: "accelerate"
      - dependency-name: "bitsandbytes"
      - dependency-name: "huggingface-hub"
      - dependency-name: "pillow"
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "transformers"
      - dependency-name: "xgrammar"
    groups:
      dev-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # optional-extras.yml is byte-bound by the MRL-0809 static prerequisite
    # manifest. Changes to these action references require governed manifest
    # regeneration and qualification rather than an automated update PR.
    ignore:
      - dependency-name: "actions/checkout"
      - dependency-name: "astral-sh/setup-uv"
    # CodeQL init/analyze must move together. Separate Dependabot PRs produce
    # mixed action versions and a configuration-error failure.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
